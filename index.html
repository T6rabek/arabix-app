/* ============================================================
   Arabix — Qur'oniy Arabcha
   Design system: one crimson accent on neutral paper, a single
   sans type system (Quranic text stays in Naskh), a 4pt spacing
   scale, one page gutter, and one elevation scale.

   Rules of the house:
   - Every page-level block shares ONE horizontal gutter (--pad-x).
     Never hand-write a margin-left on a top-level block.
   - Secondary text uses --ink-2 / --ink-3, never `opacity`.
   - Anything on an accent fill uses --on-accent, never #fff.
   - Type sizes come from the --fs-* scale.
   ============================================================ */

:root{
  /* ---------- Type ---------- */
  --font-sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display:var(--font-sans);
  --font-body:var(--font-sans);
  --font-ui:var(--font-sans);
  --font-ar:'Naskh Quran', 'Noto Naskh Arabic', var(--font-sans);

  --fs-2xs:.6875rem;   /* 11 — micro labels, tags */
  --fs-xs:.75rem;      /* 12 — captions, sub-labels */
  --fs-sm:.8125rem;    /* 13 — secondary UI, buttons */
  --fs-base:.9375rem;  /* 15 — body copy */
  --fs-md:1rem;        /* 16 — card titles */
  --fs-lg:1.125rem;    /* 18 — sheet / section titles */
  --fs-xl:1.375rem;    /* 22 — page titles */
  --fs-2xl:1.75rem;    /* 28 — hero */

  --lh-tight:1.25;
  --lh-snug:1.4;
  --lh-body:1.6;

  /* ---------- Space (4pt scale) ---------- */
  --s1:4px;  --s2:8px;  --s3:12px; --s4:16px;
  --s5:20px; --s6:24px; --s7:28px; --s8:32px; --s10:40px;

  --pad-x:16px;         /* the one page gutter */
  --measure:66ch;       /* max comfortable reading line */
  --content-max:760px;  /* max column width on wide screens */
  --tap:44px;           /* minimum touch target */

  /* ---------- Radius ---------- */
  --r-xs:8px; --r-sm:10px; --r:14px; --r-lg:18px; --r-pill:999px;

  /* ---------- Neutrals & ink ---------- */
  --ink:#141a21;
  --ink-2:#5b6672;
  --ink-3:#66707b;
  --paper:#ffffff;
  --surface:#ffffff;
  --surface-2:#f4f5f7;
  --surface-3:#e9ecef;
  --rule:#e3e6ea;
  --rule-strong:#ccd2d8;

  /* ---------- Accent & semantics ---------- */
  --accent:#b3123a;
  --accent-hover:#910e2f;
  --accent-soft:#fdeaf0;
  --accent-strong:#7a0c28;
  --on-accent:#ffffff;

  --gold:var(--accent);
  --gold-soft:var(--accent-soft);

  --rubric:#c62828;
  --rubric-soft:#fdeaea;
  --jade:#256b4c;
  --jade-soft:#e7f1ec;
  --on-jade:#ffffff;
  --violet:#5b3a99;
  --violet-soft:#f0eafa;

  /* ---------- Elevation ---------- */
  --shadow-sm:0 1px 2px rgba(20,26,33,.06), 0 1px 3px rgba(20,26,33,.05);
  --shadow:0 2px 4px rgba(20,26,33,.05), 0 8px 20px -10px rgba(20,26,33,.18);
  --shadow-lg:0 8px 16px rgba(20,26,33,.08), 0 24px 48px -16px rgba(20,26,33,.28);

  --ring:0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent);

  color-scheme:light;
}

/* Dark palette: same neutral hue family as light (cool grey), so borders
   and fills never drift warm against the surfaces they sit on. Text on an
   accent fill flips to dark, because the dark-mode accent is a light pink. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7eaee;
    --ink-2:#a2abb5;
    --ink-3:#8a939d;
    --paper:#0f1319;
    --surface:#161b22;
    --surface-2:#1e242d;
    --surface-3:#28303a;
    --rule:#2a313b;
    --rule-strong:#3b444f;
    --accent:#ff8aa4;
    --accent-hover:#ffa3b8;
    --accent-soft:#3a1522;
    --accent-strong:#ffb3c4;
    --on-accent:#3d0416;
    --rubric:#ff7b7b;
    --rubric-soft:#3a1618;
    --jade:#5fc79b;
    --jade-soft:#14291f;
    --on-jade:#06231a;
    --violet:#c3a6f5;
    --violet-soft:#241a38;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 10px 20px rgba(0,0,0,.45), 0 28px 56px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7eaee; --ink-2:#a2abb5; --ink-3:#8a939d;
  --paper:#0f1319; --surface:#161b22; --surface-2:#1e242d; --surface-3:#28303a;
  --rule:#2a313b; --rule-strong:#3b444f;
  --accent:#ff8aa4; --accent-hover:#ffa3b8; --accent-soft:#3a1522;
  --accent-strong:#ffb3c4; --on-accent:#3d0416;
  --rubric:#ff7b7b; --rubric-soft:#3a1618;
  --jade:#5fc79b; --jade-soft:#14291f; --on-jade:#06231a;
  --violet:#c3a6f5; --violet-soft:#241a38;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 10px 20px rgba(0,0,0,.45), 0 28px 56px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#141a21; --ink-2:#5b6672; --ink-3:#66707b;
  --paper:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --surface-3:#e9ecef;
  --rule:#e3e6ea; --rule-strong:#ccd2d8;
  --accent:#b3123a; --accent-hover:#910e2f; --accent-soft:#fdeaf0;
  --accent-strong:#7a0c28; --on-accent:#ffffff;
  --rubric:#c62828; --rubric-soft:#fdeaea;
  --jade:#256b4c; --jade-soft:#e7f1ec; --on-jade:#ffffff;
  --violet:#5b3a99; --violet-soft:#f0eafa;
  --shadow-sm:0 1px 2px rgba(20,26,33,.06), 0 1px 3px rgba(20,26,33,.05);
  --shadow:0 2px 4px rgba(20,26,33,.05), 0 8px 20px -10px rgba(20,26,33,.18);
  --shadow-lg:0 8px 16px rgba(20,26,33,.08), 0 24px 48px -16px rgba(20,26,33,.28);
  color-scheme:light;
}

/* ---------- Reset & base ---------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
  text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:var(--lh-tight);}
p{margin:0;}
.ar,[dir="rtl"]{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;}
button{font-family:var(--font-ui);color:inherit;}
button:not(:disabled){cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs);}
::selection{background:var(--accent-soft);color:var(--accent-strong);}

/* Shared interactive-surface behaviour. Hover only where a real pointer
   exists, so touch devices don't get stuck in a hover state after a tap. */
@media (hover:hover){
  .unit-row:hover, .alifbo-node:hover, .nav-menu-item:hover, .ex-opt:hover,
  .match-item:hover, .vocab-card:hover, .reading-cell:hover, .grammar-card:hover,
  .madina-game-btn:hover, .action-btn:hover, .sheet-option:hover,
  .scramble-tile:hover, .alifbo-entry-card:hover{
    border-color:var(--rule-strong);
    background:var(--surface-2);
  }
  .unit-row:hover{box-shadow:var(--shadow-sm);}
}

/* ---------- App shell ---------- */
#app{min-height:100vh;position:relative;}
.sidebar{display:none;}
.app-content{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:var(--s1);
  min-height:56px;
  padding:calc(env(safe-area-inset-top,0px) + var(--s2)) var(--s2) var(--s2);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--rule);
}
.topbar-brand{letter-spacing:-.01em; font-size:var(--fs-lg) !important;}
.topbar h1{
  font-size:var(--fs-md); font-weight:700; color:var(--ink); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding-inline:var(--s1);
}
.topbar .eyebrow{
  font-family:var(--font-ui); font-size:var(--fs-2xs); letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:1px;
}

/* One icon-button treatment for every control in the top bar, so the back
   arrow, theme toggle and menu button read as siblings rather than three
   unrelated widgets. */
.topbar .back-btn,
.theme-toggle,
.hamburger-btn{
  flex-shrink:0;
  width:var(--tap); height:var(--tap);
  display:flex; align-items:center; justify-content:center;
  background:none; border:none; border-radius:var(--r-sm);
  color:var(--ink); padding:0;
}
.topbar .back-btn{font-size:1.35rem; line-height:1; color:var(--accent);}
.theme-toggle{font-size:1rem;}
@media (hover:hover){
  .topbar .back-btn:hover, .theme-toggle:hover, .hamburger-btn:hover{background:var(--surface-2);}
}
.topbar .back-btn:active, .theme-toggle:active, .hamburger-btn:active{background:var(--surface-3);}

main{
  flex:1;
  padding-bottom:var(--s8);
}

/* THE gutter rule. Every top-level block in a view lines up on the same two
   vertical edges — the single biggest source of "off" in the old layout was
   each block carrying its own hand-written margin (14/16/20px). Blocks that
   manage their own padding (.hero, .folio) opt out. */
main > *:not(.hero):not(.folio):not(.empty-state){
  margin-left:var(--pad-x);
  margin-right:var(--pad-x);
}

/* ---------- Hamburger menu button ---------- */
.hamburger-btn{
  flex-direction:column; justify-content:center; gap:4px;
  position:relative;
}
.hamburger-btn span{
  display:block; width:20px; height:2px; background:var(--ink); border-radius:2px;
}
.menu-due-dot{
  position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
  background:var(--rubric); border:2px solid var(--paper);
}

/* ---------- Nav menu (in bottom sheet) ---------- */
.nav-menu-list{display:flex; flex-direction:column; gap:var(--s1); margin-bottom:var(--s2);}
.nav-menu-item{
  display:flex; align-items:center; gap:var(--s3); width:100%;
  background:var(--paper); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s3) var(--s3); text-align:left;
  transition:background .12s, border-color .12s;
}
.nav-menu-item.active{border-color:var(--accent); background:var(--accent-soft);}
.nav-menu-item.active .nav-menu-label{color:var(--accent-strong);}
.nav-menu-ic{
  flex-shrink:0; width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent);
}
.nav-menu-text{flex:1; display:flex; flex-direction:column; min-width:0; gap:1px;}
.nav-menu-label{font-family:var(--font-display); font-size:var(--fs-base); font-weight:600; color:var(--ink);}
.nav-menu-sub{font-family:var(--font-ui); font-size:var(--fs-xs); color:var(--ink-2); line-height:var(--lh-snug);}
.nav-menu-item .chev{color:var(--ink-3); font-size:1.1rem; flex-shrink:0;}
.nav-menu-badge{
  background:var(--rubric); color:#fff; font-family:var(--font-ui); font-weight:700;
  font-size:var(--fs-2xs); min-width:20px; height:20px; border-radius:var(--r-pill); padding:0 6px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* ---------- Home: hero + unit list ---------- */
.hero{
  padding:var(--s6) var(--pad-x) var(--s5);
  background:
    radial-gradient(120% 110% at 100% 0%, var(--accent-soft), transparent 62%),
    linear-gradient(180deg, var(--accent-soft), var(--paper) 92%);
  border-bottom:1px solid var(--rule);
}
/* Hero rendered inside a .folio needs to break back out to the page edges. */
.hero-flush{
  margin:calc(-1 * var(--s5)) calc(-1 * var(--pad-x)) var(--s5);
  border-radius:0;
}
.hero .kicker{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); margin-bottom:var(--s3); display:block;
  line-height:var(--lh-snug);
}
.hero h1{font-size:var(--fs-2xl); color:var(--ink); letter-spacing:-.02em;}
/* The Arabic wordmark belongs with the Latin one, not stranded on the far
   right edge of the container — so it is inline-block and left-aligned. */
.hero .ar-line{
  font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate;
  color:var(--accent); font-size:1.15rem; font-weight:400;
  display:inline-block; margin-left:var(--s3); vertical-align:baseline;
}
.hero p{
  font-size:var(--fs-base); color:var(--ink-2); margin:var(--s3) 0 0;
  max-width:var(--measure); line-height:var(--lh-body);
}

.progress-strip{
  display:flex; align-items:center; gap:var(--s3); margin-top:var(--s4);
  padding:var(--s3) var(--s4); background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r); box-shadow:var(--shadow-sm);
}
.progress-strip .ring{
  position:relative;
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:conic-gradient(var(--jade) calc(var(--pct,0)*1%), var(--surface-3) 0);
  display:flex; align-items:center; justify-content:center;
}
.progress-strip .ring::after{
  content:""; width:33px; height:33px; border-radius:50%; background:var(--surface);
}
/* Centred inside the ring itself rather than positioned with a magic offset. */
.progress-strip .ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700; color:var(--ink);
}
.progress-strip .txt{
  font-family:var(--font-ui); font-size:var(--fs-sm); line-height:var(--lh-snug);
  color:var(--ink-2); min-width:0;
}
.progress-strip .txt b{
  font-family:var(--font-display); font-size:var(--fs-md); font-weight:700;
  display:block; color:var(--ink); margin-bottom:2px;
}

.phase-label{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); margin-top:var(--s7); margin-bottom:var(--s2);
  display:flex; align-items:baseline; gap:var(--s2); flex-wrap:wrap;
}
.phase-label .sub{
  color:var(--ink-3); text-transform:none; letter-spacing:0;
  font-size:var(--fs-xs); font-weight:400;
}

.unit-list{display:flex; flex-direction:column; gap:var(--s2); padding:0;}
.unit-row{
  display:flex; align-items:center; gap:var(--s3);
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s3) var(--s4); text-align:left; width:100%; min-height:var(--tap);
  transition:background .12s, border-color .12s, box-shadow .12s;
}
.unit-row:active{background:var(--surface-2); border-color:var(--rule-strong);}
.unit-row .num{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm);
  background:var(--accent-soft); color:var(--accent-strong);
}
.unit-row.done .num{background:var(--jade); color:var(--on-jade);}
.unit-row .meta{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.unit-row .meta .t{
  font-family:var(--font-display); font-size:var(--fs-base); font-weight:600;
  color:var(--ink); display:block; line-height:var(--lh-snug);
}
.unit-row .meta .s{
  font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate;
  font-size:var(--fs-sm); color:var(--ink-2); display:block;
}
/* Subtitles that mix Arabic terms with a Latin note ("الفاتحة · 7 oyat") need
   an LTR base direction: under RTL the bidi algorithm moves the trailing
   Latin run to the visual left, so the line read back-to-front. Each Arabic
   run still lays out right-to-left inside its own isolate. */
.unit-row .meta .s-mixed{direction:ltr; text-align:left;}
.unit-row .chev{color:var(--ink-3); font-size:1.1rem; flex-shrink:0;}

/* ---------- Unit reader ---------- */
.folio{padding:var(--s5) var(--pad-x) var(--s8);}
/* Components carry their own top margin for in-flow rhythm; the first one in
   a folio doesn't need it on top of the folio's own padding. */
.folio > *:first-child{margin-top:0;}
.unit-hero{margin-bottom:var(--s6); padding-bottom:var(--s5); border-bottom:1px solid var(--rule);}
.unit-hero .badge{
  display:inline-block; background:var(--accent); color:var(--on-accent); font-family:var(--font-ui);
  font-weight:700; font-size:var(--fs-2xs); letter-spacing:.04em; text-transform:uppercase;
  padding:4px 10px; border-radius:var(--r-pill); margin-bottom:var(--s3);
}
.unit-hero h1{font-size:var(--fs-xl); color:var(--ink); letter-spacing:-.01em;}
.unit-hero .ar{
  font-size:1.15rem; color:var(--ink-2); margin-top:var(--s1);
  display:inline-block; unicode-bidi:isolate;
}
/* Mixed Arabic + Uzbek subtitle: LTR base so the Uzbek gloss stays after the
   Arabic term (each Arabic run is isolated in a <bdi> at render time). */
.unit-hero .ar-mixed{display:block; direction:ltr; text-align:inherit;}
.unit-hero p{color:var(--ink-2); max-width:var(--measure);}

.section-label{
  display:flex; align-items:center; gap:var(--s2); margin:var(--s7) 0 var(--s3);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-2xs); letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent);
}
.section-label .dot{
  width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; font-size:var(--fs-2xs); flex-shrink:0;
  letter-spacing:0;
}
.prose{font-size:var(--fs-base); line-height:var(--lh-body); max-width:var(--measure); color:var(--ink);}
.prose p{margin:0 0 var(--s3);}
.prose p:last-child{margin-bottom:0;}
.prose .w{font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate; color:var(--accent-strong); font-weight:700;}

.surah-card{
  background:var(--surface);
  border:1px solid var(--rule); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:var(--s5) var(--s4);
  margin:var(--s3) 0; box-shadow:var(--shadow-sm);
}
.ayah{
  font-family:var(--font-ar); direction:rtl; text-align:right;
  font-size:1.45rem; line-height:2.15; margin:0 0 var(--s1);
}
.ayah .n{
  font-family:var(--font-ui); font-size:var(--fs-2xs); color:var(--accent);
  border:1px solid var(--accent); border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; width:24px; height:24px; margin:0 4px;
  vertical-align:middle;
}

.wbw-block{margin:var(--s4) 0; padding-bottom:var(--s3); border-bottom:1px solid var(--rule);}
.wbw-block:last-child{border-bottom:none; padding-bottom:0;}
.wbw-ref{
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-2xs); color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.08em;
}
.wbw-ar{font-family:var(--font-ar); direction:rtl; font-size:1.25rem; margin:var(--s2) 0 var(--s2); line-height:1.9;}
.wbw-meaning{color:var(--ink-2); margin:0 0 var(--s2);}

/* Callout cards. A tinted left rail on a neutral surface keeps long passages
   readable — a full accent-tinted fill behind body copy is hard to read and
   drowns out the genuinely important accents on the page. */
.card{
  border-radius:var(--r); padding:var(--s4); margin:var(--s4) 0;
  border:1px solid var(--rule);
  border-left:3px solid var(--c, var(--accent));
  background:var(--surface);
  max-width:var(--measure);
}
.card .card-title{
  display:flex; align-items:center; gap:var(--s2); font-family:var(--font-ui); font-weight:700;
  font-size:var(--fs-sm); margin-bottom:var(--s2); color:var(--c, var(--accent));
}
.card .card-title .ic{
  width:22px; height:22px; border-radius:50%; background:var(--c, var(--accent)); color:var(--on-accent);
  display:flex; align-items:center; justify-content:center; font-size:var(--fs-2xs); flex-shrink:0;
}
.card.qoida{--c:var(--accent);}
.card.tafakkur{--c:var(--violet);}
.card.talaffuz{--c:var(--jade);}
.card.talaffuz .card-title .ic{color:var(--on-jade);}
.card p{margin:0 0 var(--s2); font-size:var(--fs-base); line-height:var(--lh-body);}
.card p:last-child{margin-bottom:0;}
.review-chip{
  display:inline-block; background:var(--violet-soft); color:var(--violet); font-family:var(--font-ui);
  font-weight:700; font-size:var(--fs-2xs); padding:2px 8px; border-radius:var(--r-xs); margin-left:2px;
}

/* ---------- Vocab ---------- */
.vocab-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:var(--s2); margin:var(--s3) 0;}
.vocab-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-sm);
  padding:var(--s3); min-height:68px; position:relative; overflow:hidden; text-align:left;
  transition:border-color .12s, background .12s;
}
.vocab-card .ar{font-size:1.15rem; color:var(--accent-strong); display:block;}
.vocab-card .uz{font-size:var(--fs-xs); color:var(--ink-2); opacity:0; max-height:0; transition:opacity .15s;}
.vocab-card.flipped{border-color:var(--rule-strong);}
.vocab-card.flipped .uz{opacity:1; max-height:44px; margin-top:var(--s1);}
.vocab-card .tag{
  position:absolute; top:var(--s2); right:var(--s2);
  font-size:var(--fs-2xs); font-family:var(--font-ui); font-weight:700;
}
.vocab-card.core .tag{color:var(--rubric);}
.vocab-card.rec .tag{color:var(--ink-3);}

/* ---------- Exercises ---------- */
.ex-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s4); margin:var(--s4) 0; max-width:var(--measure);
}
.ex-kicker{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2);
}
.ex-q{font-size:var(--fs-base); margin-bottom:var(--s3); line-height:var(--lh-body);}
.ex-q .ar{font-size:1.15rem;}
.ex-options{display:flex; flex-direction:column; gap:var(--s2);}
.ex-opt{
  text-align:left; padding:var(--s3) var(--s3); border-radius:var(--r-sm); border:1.5px solid var(--rule);
  background:var(--surface); font-family:var(--font-body); font-size:var(--fs-base);
  color:var(--ink); min-height:var(--tap);
  display:flex; justify-content:space-between; align-items:center; gap:var(--s2);
  transition:background .12s, border-color .12s;
}
.ex-opt .ar{font-size:1.05rem;}
.ex-opt:active{background:var(--surface-2);}
.ex-opt.correct{background:var(--jade-soft); border-color:var(--jade); color:var(--jade);}
.ex-opt.wrong{background:var(--rubric-soft); border-color:var(--rubric); color:var(--rubric);}
.ex-opt.disabled{pointer-events:none; opacity:.5;}
.ex-opt.disabled.correct, .ex-opt.disabled.wrong{opacity:1;}
.ex-feedback{
  margin-top:var(--s3); font-size:var(--fs-sm); padding:var(--s2) var(--s3);
  border-radius:var(--r-xs); line-height:var(--lh-snug);
}
.ex-feedback.ok{background:var(--jade-soft); color:var(--jade);}
.ex-feedback.no{background:var(--rubric-soft); color:var(--rubric);}

/* ---------- Form controls ---------- */
/* Inputs do not inherit font or colour from body, so without this every
   field rendered in the UA's default black — invisible on the dark theme. */
input[type="text"], input[type="number"], input[type="time"], input[type="search"]{
  width:100%; min-height:var(--tap); padding:var(--s3);
  border:1px solid var(--rule); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink);
  font-family:var(--font-body); font-size:var(--fs-base); line-height:1.2;
  transition:border-color .12s, box-shadow .12s;
}
input::placeholder{color:var(--ink-3); opacity:1;}
input[type="text"]:focus-visible, input[type="number"]:focus-visible,
input[type="time"]:focus-visible, input[type="search"]:focus-visible{
  outline:none; border-color:var(--accent); box-shadow:var(--ring);
}
input[type="checkbox"]{width:20px; height:20px; accent-color:var(--jade); flex-shrink:0;}
.field-search{margin-bottom:var(--s3);}

/* ---------- Buttons ---------- */
.reveal-btn{
  background:var(--accent); color:var(--on-accent); border:none; border-radius:var(--r-sm);
  padding:0 var(--s5); min-height:var(--tap);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm);
  transition:background .12s;
}
@media (hover:hover){ .reveal-btn:hover{background:var(--accent-hover);} }
.reveal-btn:active{background:var(--accent-hover);}
.reveal-answer{
  margin-top:var(--s3); padding:var(--s3); background:var(--surface-2);
  border-left:3px solid var(--accent); border-radius:var(--r-xs);
  font-size:var(--fs-base); line-height:var(--lh-body);
}
.self-check{display:flex; gap:var(--s2); margin-top:var(--s3);}
.self-check button{
  flex:1; border-radius:var(--r-sm); min-height:var(--tap); padding:var(--s2);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm);
  border:1.5px solid var(--rule); background:var(--surface); color:var(--ink);
  transition:background .12s, border-color .12s;
}
.self-check button.got.picked{background:var(--jade-soft); border-color:var(--jade); color:var(--jade);}
.self-check button.miss.picked{background:var(--rubric-soft); border-color:var(--rubric); color:var(--rubric);}

.match-row{display:flex; gap:var(--s3); margin:var(--s3) 0;}
.match-col{flex:1; display:flex; flex-direction:column; gap:var(--s2); min-width:0;}
.match-item{
  padding:var(--s3) var(--s2); border-radius:var(--r-sm); border:1.5px solid var(--rule);
  background:var(--surface); color:var(--ink);
  font-size:var(--fs-sm); text-align:center; min-height:var(--tap);
  transition:background .12s, border-color .12s;
}
.match-item.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
.match-item.matched{border-color:var(--jade); background:var(--jade-soft); color:var(--jade); pointer-events:none;}
.match-item.shake{border-color:var(--rubric); background:var(--rubric-soft); animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

.unit-nav{display:flex; gap:var(--s3); margin-top:var(--s8); padding-top:var(--s5); border-top:1px solid var(--rule);}
.unit-nav button{
  flex:1; min-height:var(--tap); padding:var(--s3); border-radius:var(--r-sm);
  border:1px solid var(--rule); background:var(--surface);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm); color:var(--ink);
  transition:background .12s, border-color .12s;
}
@media (hover:hover){ .unit-nav button:not(:disabled):hover{background:var(--surface-2); border-color:var(--rule-strong);} }
.unit-nav button.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
@media (hover:hover){ .unit-nav button.primary:not(:disabled):hover{background:var(--accent-hover); border-color:var(--accent-hover);} }
.unit-nav button:disabled{opacity:.4; cursor:not-allowed;}

.milestone{
  margin-top:var(--s6); padding:var(--s6) var(--s5); border-radius:var(--r);
  background:var(--accent-soft);
  border:1px solid var(--accent); text-align:center; max-width:var(--measure);
}
.milestone .star{font-size:1.75rem; color:var(--accent); line-height:1;}
.milestone h3{font-size:var(--fs-lg); margin:var(--s2) 0 var(--s3); color:var(--ink);}
.milestone p{font-size:var(--fs-sm); line-height:var(--lh-body); text-align:left; color:var(--ink-2);}
/* Primary call-to-action variant: centred copy, action button at the foot. */
.milestone-action p{text-align:center; max-width:36ch; margin-inline:auto;}
.milestone-action .sheet-btn{margin-top:var(--s4); width:auto; min-width:min(100%, 260px); padding-inline:var(--s6);}

/* ============================================================
   Data visualisation
   One ordinal ramp in the jade family — jade already means
   "accomplished" everywhere else in the app, so progress marks
   inherit that meaning instead of competing with the crimson UI
   accent. Steps are monotone in lightness and the step nearest the
   surface clears 2:1; the anchor flips in dark mode. Validated with
   validate_palette.js --ordinal in both modes.
   ============================================================ */
:root{
  --v1:#7dc3a4; --v2:#5cab8a; --v3:#41916e; --v4:#2c7757; --v5:#1c5e42; --v6:#0f4630;
  --v-track:var(--surface-3);         /* unfilled meter track */
  --v-empty:var(--surface-3);         /* "no activity" calendar cell */
  --v-grid:var(--rule);               /* hairline baseline */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --v1:#1c5e42; --v2:#2c7757; --v3:#41916e; --v4:#5cab8a; --v5:#7dc3a4; --v6:#a3d9c0;
  }
}
:root[data-theme="dark"]{
  --v1:#1c5e42; --v2:#2c7757; --v3:#41916e; --v4:#5cab8a; --v5:#7dc3a4; --v6:#a3d9c0;
}
:root[data-theme="light"]{
  --v1:#7dc3a4; --v2:#5cab8a; --v3:#41916e; --v4:#2c7757; --v5:#1c5e42; --v6:#0f4630;
}

/* ---- Hero figure: the one number the screen leads with ---- */
.viz-hero{
  display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap;
  margin-bottom:var(--s2);
}
.viz-hero-value{
  font-family:var(--font-sans); font-size:3rem; font-weight:700; line-height:1;
  letter-spacing:-.03em; color:var(--ink);
  /* Proportional figures: tabular digits read loose at display size. */
  font-variant-numeric:proportional-nums;
}
.viz-hero-unit{font-size:var(--fs-lg); font-weight:700; color:var(--ink-3); line-height:1;}
.viz-hero-caption{font-size:var(--fs-sm); color:var(--ink-2); margin-bottom:var(--s6);}

/* ---- Stat tiles ---- */
.stat-row{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  gap:var(--s2); margin-bottom:var(--s6);
}
.stat-tile{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s3) var(--s4); display:flex; flex-direction:column; gap:2px; min-width:0;
}
.stat-tile-label{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
}
.stat-tile-value{
  font-size:var(--fs-xl); font-weight:700; color:var(--ink); line-height:1.15;
  font-variant-numeric:proportional-nums;
}
.stat-tile-sub{font-family:var(--font-ui); font-size:var(--fs-2xs); color:var(--ink-2);}

/* ---- Chart card ---- */
.viz-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4);
}
.viz-title{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  margin-bottom:var(--s1);
}
.viz-sub{font-family:var(--font-ui); font-size:var(--fs-xs); color:var(--ink-2); margin-bottom:var(--s4);}

/* ---- Activity calendar (binary: the app records one flag per day) ---- */
/* Cells are capped, not stretched: left to fill a wide card they grow into
   large saturated blocks that shout over everything else on the page. */
.cal-grid{
  display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr);
  grid-auto-columns:1fr; gap:3px; margin-bottom:var(--s3);
}
.cal-cell{
  aspect-ratio:1; border-radius:3px; background:var(--v-empty); min-width:0;
}
.cal-cell.on{background:var(--v4);}
.cal-cell.future{background:transparent;}
.cal-legend{
  display:flex; align-items:center; gap:var(--s2);
  font-family:var(--font-ui); font-size:var(--fs-2xs); color:var(--ink-2);
}
.cal-key{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.cal-key.on{background:var(--v4);} .cal-key.off{background:var(--v-empty);}

/* ---- Meters (one ratio against a limit) ---- */
.meter-row{display:flex; flex-direction:column; gap:var(--s1); margin-bottom:var(--s4);}
.meter-row:last-child{margin-bottom:0;}
.meter-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3);
  font-family:var(--font-ui); font-size:var(--fs-sm);
}
.meter-name{color:var(--ink); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.meter-value{color:var(--ink-2); flex-shrink:0; font-variant-numeric:tabular-nums;}
/* Track is a lighter step of the same ramp, so state reads across the whole bar. */
.meter-track{height:8px; border-radius:var(--r-pill); background:var(--v-track); overflow:hidden;}
.meter-fill{height:100%; border-radius:var(--r-pill); background:var(--v4); transition:width .4s ease;}

/* ---- Column chart (ordered buckets, ordinal ramp) ---- */
.col-chart{display:flex; align-items:flex-end; gap:var(--s2); height:132px; margin-bottom:var(--s1);}
.col-slot{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:var(--s1); min-width:0; height:100%;}
.col-value{
  font-family:var(--font-ui); font-size:var(--fs-2xs); font-weight:700; color:var(--ink);
  font-variant-numeric:tabular-nums; line-height:1;
}
/* 4px rounded data-end, square at the baseline; capped thickness. */
.col-bar{
  width:100%; max-width:24px; border-radius:4px 4px 0 0; background:var(--v3);
  min-height:2px; transition:height .4s ease;
}
.col-axis{
  display:flex; gap:var(--s2); border-top:1px solid var(--v-grid); padding-top:var(--s2);
}
.col-axis span{
  flex:1; text-align:center; min-width:0;
  font-family:var(--font-ui); font-size:var(--fs-2xs); color:var(--ink-3);
  line-height:1.25;
}

/* ---------- Reference tables ---------- */
.ref-table{width:100%; border-collapse:collapse; font-size:var(--fs-sm); margin:var(--s3) 0;}
.ref-table th{
  text-align:left; font-family:var(--font-ui); font-weight:700; font-size:var(--fs-2xs);
  text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  border-bottom:1px solid var(--rule-strong); padding:var(--s2);
  position:sticky; top:0; background:var(--paper); z-index:1;
  white-space:nowrap;
}
/* A header always sits over its column on the same edge as the values below
   it — Arabic columns are right-aligned, so their headers are too. */
.ref-table th.ar{text-align:right; direction:ltr;}
.ref-table td{padding:var(--s3) var(--s2); border-bottom:1px solid var(--rule); vertical-align:top; color:var(--ink);}
.ref-table tbody tr:nth-child(even) td{background:var(--surface-2);}
.ref-table td.ar{
  font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate;
  font-size:1.05rem; color:var(--accent-strong); text-align:right;
}
/* Root triliterals must never wrap mid-root. */
.ref-table td.ar-root{white-space:nowrap;}
/* Short numeric columns take only the width they need, leaving the rest to
   the Arabic column that actually needs room. */
.ref-table .col-tight{white-space:nowrap; width:1%;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:var(--s3) 0;}

.chip-row{display:flex; flex-wrap:wrap; gap:var(--s2); margin:var(--s3) 0;}
.chip{
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-pill);
  padding:var(--s2) var(--s4); font-size:var(--fs-sm); color:var(--ink);
  display:inline-flex; align-items:center; gap:var(--s2); min-height:36px;
  transition:background .12s, border-color .12s, color .12s;
}
.chip .ar{font-size:1rem; color:var(--accent-strong);}
/* Segmented-control style for the reference tabs. */
.chip.is-active{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.chip.is-active .ar{color:var(--on-accent);}
@media (hover:hover){ .chip[onclick]:not(.is-active):hover{background:var(--surface-3);} }

.empty-state{padding:var(--s10) var(--s6); text-align:center; color:var(--ink-2); font-size:var(--fs-base);}

/* ---------- Empty / error state ---------- */
.state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:var(--s3); padding:var(--s10) var(--s5); max-width:38ch; margin-inline:auto;
}
.state-ic{
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--ink-3);
}
.state.is-error .state-ic{background:var(--rubric-soft); color:var(--rubric);}
.state-title{font-family:var(--font-display); font-size:var(--fs-md); font-weight:700; color:var(--ink);}
.state-body{font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--ink-2); margin:0;}
.state .reveal-btn{margin-top:var(--s2);}

/* ---------- Skeletons ----------
   A shimmering placeholder that matches the shape of what is loading, so the
   page does not jump when content lands. */
.skel{
  background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size:400% 100%;
  animation:skel-shimmer 1.4s ease-in-out infinite;
  border-radius:var(--r-xs);
}
@keyframes skel-shimmer{ from{background-position:100% 0;} to{background-position:0 0;} }
.skel-list{display:flex; flex-direction:column; gap:var(--s2);}
.skel-row{
  display:flex; align-items:center; gap:var(--s3);
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:var(--s3) var(--s4); min-height:var(--tap);
}
.skel-dot{width:32px; height:32px; border-radius:50%; flex-shrink:0;}
.skel-lines{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
.skel-line{height:10px;}
.skel-line.short{width:45%;}
@media (prefers-reduced-motion: reduce){
  .skel{animation:none;}
}

/* ---------- Streak strip ---------- */
.streak-strip{
  display:flex; align-items:center; gap:var(--s3); margin-top:var(--s2);
  padding:var(--s3) var(--s4); background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r);
}
.streak-flame{
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  width:32px; height:32px; color:var(--ink-3);
}
.streak-flame.lit{color:var(--accent);}
.streak-strip .txt{
  font-family:var(--font-ui); font-size:var(--fs-sm); line-height:var(--lh-snug);
  display:flex; flex-direction:column; gap:2px; color:var(--ink-2); min-width:0;
}
.streak-strip .txt b{font-family:var(--font-display); font-size:var(--fs-md); font-weight:700; color:var(--ink);}

/* ---------- Install action row ---------- */
.action-row{display:flex; gap:var(--s2); margin-top:var(--s4);}
.action-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:var(--s2);
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-sm);
  min-height:var(--tap); padding:var(--s2) var(--s3);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm);
  color:var(--ink); transition:background .12s, border-color .12s;
}
.action-btn .ic{font-size:var(--fs-md); line-height:1;}
/* The install prompt is an offer, not the primary task on the page — it gets
   an accent outline rather than a full-bleed accent fill competing with the
   lesson list underneath it. */
.action-btn.primary{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);
}
@media (hover:hover){ .action-btn.primary:hover{background:var(--accent); border-color:var(--accent); color:var(--on-accent);} }
.action-btn.primary:active{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}

/* ---------- Bottom sheet ---------- */
.sheet-overlay{
  position:fixed; inset:0; background:rgba(10,14,20,.55); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.sheet-overlay.open{opacity:1; pointer-events:auto;}
.sheet{
  width:100%; max-width:560px; background:var(--surface); border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--s2) var(--s5) calc(env(safe-area-inset-bottom,0px) + var(--s6));
  transform:translateY(100%); transition:transform .25s ease;
  box-shadow:var(--shadow-lg); max-height:85vh; overflow-y:auto;
}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet .grabber{width:36px; height:4px; background:var(--rule-strong); border-radius:3px; margin:var(--s2) auto var(--s4);}
.sheet h2{font-size:var(--fs-lg); margin-bottom:var(--s1); color:var(--ink);}
.sheet .sheet-sub{font-size:var(--fs-sm); color:var(--ink-2); margin-bottom:var(--s4);}
.sheet-option{
  background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:var(--s4);
  margin-bottom:var(--s3); transition:border-color .12s, background .12s;
}
.sheet-option .so-title{
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-base);
  display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); color:var(--ink);
}
.sheet-option p{font-size:var(--fs-sm); line-height:var(--lh-body); margin:0 0 var(--s2); color:var(--ink-2);}
.sheet-option ol{margin:0 0 var(--s2); padding-left:18px; font-size:var(--fs-sm); line-height:1.7; color:var(--ink-2);}
.sheet-btn{
  width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:var(--r-sm);
  min-height:var(--tap); padding:var(--s2) var(--s4);
  font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm); transition:background .12s;
}
@media (hover:hover){ .sheet-btn:hover{background:var(--accent-hover);} }
.sheet-close{
  display:block; width:100%; text-align:center; background:none; border:none;
  color:var(--ink-2); font-family:var(--font-ui); font-weight:700; font-size:var(--fs-sm);
  min-height:var(--tap); padding:var(--s2); border-radius:var(--r-sm);
}
@media (hover:hover){ .sheet-close:hover{background:var(--surface-2); color:var(--ink);} }

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); font-family:var(--font-ui);
  font-size:var(--fs-sm); font-weight:600;
  padding:var(--s3) var(--s5); border-radius:var(--r-pill); z-index:60; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; max-width:88%; text-align:center; box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Quran reader ---------- */
.qayah{transition:background .3s, border-color .3s;}
.qayah.qayah-active{background:var(--accent-soft); border-color:var(--accent);}
.qplay-btn{
  background:var(--accent-soft); color:var(--accent-strong); border:none; border-radius:50%;
  width:36px; height:36px; flex-shrink:0; font-size:.95rem;
  display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s;
}
@media (hover:hover){ .qplay-btn:hover{background:var(--accent); color:var(--on-accent);} }
.qplay-btn:active{background:var(--accent); color:var(--on-accent);}
.qayah-meaning{margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--rule); color:var(--ink-2);}
.qplayer-bar{
  position:fixed; left:50%; transform:translateX(-50%);
  width:calc(100% - 2 * var(--pad-x)); max-width:560px; z-index:25;
  background:var(--accent); color:var(--on-accent); border-radius:var(--r);
  padding:var(--s2) var(--s3); display:flex; align-items:center; gap:var(--s2);
  box-shadow:var(--shadow-lg);
}
.qplayer-toggle{
  background:color-mix(in srgb, var(--on-accent) 22%, transparent); border:none; color:var(--on-accent);
  width:34px; height:34px; border-radius:50%; font-size:.9rem; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.qplayer-label{
  font-family:var(--font-ui); font-size:var(--fs-sm); font-weight:700; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---------- Tajweed colors ---------- */
.tj-madd{color:var(--accent); font-weight:700;}
.tj-qalqala{color:var(--jade); font-weight:700;}

/* ---------- Bookmark button ---------- */
.qbookmark-btn{
  background:none; border:none; font-size:1.3rem; color:var(--ink-3);
  flex-shrink:0; line-height:1; padding:var(--s1); border-radius:var(--r-xs);
}
.qbookmark-btn.active{color:var(--accent);}

/* ---------- Hifz (memorization) ---------- */
.hz-word{
  display:inline-block; cursor:pointer; padding:2px 3px; border-radius:4px;
  transition:background .15s;
}
.hz-word:active{background:var(--accent-soft);}
.hz-word.hz-hidden{
  color:transparent; background:var(--surface-3); border-radius:6px;
  text-shadow:none; user-select:none;
}
.hz-word.hz-hidden::selection{background:transparent;}

/* ---------- Hifz: printable handwriting-practice sheet ---------- */
.wp-toolbar{display:flex; gap:var(--s3); justify-content:center; margin:var(--s1) 0 var(--s4);}
.write-sheet-page{
  min-height:78vh; padding:var(--s7) var(--s5); margin-bottom:var(--s5);
  border-bottom:1px dashed var(--rule); display:flex; flex-direction:column;
}
.write-sheet-page:last-child{border-bottom:none;}
.wp-ref{font-family:var(--font-ui); font-size:var(--fs-xs); color:var(--ink-3); text-align:center; margin-bottom:var(--s4);}
.wp-ayah-text{
  font-family:var(--font-ar); font-size:1.7rem; line-height:2.1; text-align:center;
  direction:rtl; color:var(--ink); margin-bottom:var(--s7);
}
.wp-writable{
  flex:1; min-height:280px; outline:none; cursor:text;
  font-family:var(--font-ar); font-size:1.35rem; line-height:46px;
  background-image:repeating-linear-gradient(to bottom, transparent, transparent 45px, var(--rule) 45px, var(--rule) 46px);
  padding-top:2px; color:var(--ink);
}
.wp-writable:empty:before{content:attr(data-placeholder); color:var(--ink-3); font-family:var(--font-ui); font-size:var(--fs-base);}
.wp-writable:focus{background-image:repeating-linear-gradient(to bottom, transparent, transparent 45px, var(--accent) 45px, var(--accent) 46px);}

@media print{
  #topbar, #tabbar, #sidebar, .sidebar, .no-print{display:none !important;}
  body, .folio, .write-sheet-page{background:#fff !important;}
  .app-content{margin:0 !important; max-width:none !important;}
  main{max-width:none !important;}
  .write-sheet-page{
    min-height:auto; page-break-after:always; border-bottom:none;
    padding:8mm 4mm; margin-bottom:0;
  }
  .write-sheet-page:last-child{page-break-after:auto;}
  .wp-writable{background-image:repeating-linear-gradient(to bottom, transparent, transparent 45px, #999 45px, #999 46px) !important;}
  .wp-writable:empty:before{content:'';}
}

/* ---------- Alifbo: interactive letter-reading track ---------- */
.alifbo-entry-card{
  display:flex; align-items:center; gap:var(--s3); width:auto; margin-top:var(--s4);
  padding:var(--s4); background:var(--accent-soft);
  border:1px solid var(--accent); border-radius:var(--r); text-align:left;
  font-family:inherit; transition:background .12s, border-color .12s;
}
.alifbo-entry-ic{
  flex-shrink:0; width:36px; height:36px; border-radius:var(--r-sm);
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:var(--on-accent);
}
.alifbo-entry-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.alifbo-entry-title{font-family:var(--font-display); font-size:var(--fs-base); font-weight:700; color:var(--ink);}
.alifbo-entry-sub{font-family:var(--font-ui); font-size:var(--fs-xs); color:var(--ink-2); line-height:var(--lh-snug);}

    {ref:"26–27-oyatlar — o'lim va oxirgi so'z", ar:"قِيلَ ادْخُلِ الْجَنَّةَ ۖ قَالَ يَا لَيْتَ قَوْمِي يَعْلَمُونَ ﴿٢٦﴾ بِمَا غَفَرَ لِي رَبِّي وَجَعَلَنِي مِنَ الْمُكْرَمِينَ", meaning:"(Unga) \"Jannatga kir\" deyildi. U: \"Qani qavmim bilsa edi — Robbim meni mag'firat qilgani va ikrom qilinganlardan qilganini!\" — dedi.",
     notes:"&bull; <span class='w'>قِيلَ</span> = \"deyildi\" — kim aytgani aytilmagan fe'l shakli, 29-darsda \"qilindi\" gaplari deb chuqurroq o'rganasiz<br>&bull; <span class='w'>يَا لَيْتَ</span> = \"qani edi, kошki\" — armon/orzu ifodasi, yangi<br>&bull; Diqqat qiling: bu kishi o'z qavmi tomonidan o'ldirilgan (oldingi oyatlarda), lekin o'lim onida g'azab emas, faqat qavmiga achinish va ularning ham shu ne'matdan bahramand bo'lishini istaydi — Qur'ondagi eng ta'sirli kechirimlilik namunalaridan biri"},
    {ref:"38-oyat — quyosh", ar:"وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ", meaning:"Quyosh o'zining qarorgohi tomon yuradi. Bu — Aziz, Alim (Zot)ning belgilashidir.",
     notes:"&bull; <span class='w'>تَجْرِي</span> = yuradi, oqadi — hozirgi zamon fe'li <span class='review'>&#8635; 15-dars</span><br>&bull; <span class='w'>لِمُسْتَقَرٍّ لَّهَا</span> = \"o'zining qarorgohi tomon\" — quyoshning belgilangan yo'nalishi/manzili bor<br>&bull; <span class='w'>ذَٰلِكَ</span> <span class='review'>&#8635; 10-dars</span> = bu — narigi tomonda, uzoqroqdagi narsaga ishora"},
    {ref:"40-oyat — orbitalar", ar:"لَا الشَّمْسُ يَنبَغِي لَهَا أَن تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سَابِقُ النَّهَارِ ۚ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ", meaning:"Quyoshga oyni quvib yetish loyiq emas, tun ham kunduzdan ilgarilamaydi — barchasi bir aylanada suzadi.",
     notes:"&bull; <span class='w'>لَا ... وَلَا</span> = \"na ... na ham\" — ikki tomonlama inkor, yangi naqsh<br>&bull; <span class='w'>يَنبَغِي</span> = loyiq, mos keladi<br>&bull; <span class='w'>فِي فَلَكٍ يَسْبَحُونَ</span> = \"bir falak(orbita)da suzadilar\" — 1400 yil oldin aytilgan bu oyat, har bir jism o'z yo'lida, tartib bilan harakatlanishini tasvirlaydi"},
    {ref:"65-oyat — guvohlik", ar:"الْيَوْمَ نَخْتِمُ عَلَىٰ أَفْوَاهِهِمْ وَتُكَلِّمُنَا أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا يَكْسِبُونَ", meaning:"Bugun og'izlarini muhrlaymiz, qo'llari Bizga so'zlaydi, oyoqlari qilgan ishlariga guvohlik beradi.",
     notes:"&bull; <span class='w'>نَخْتِمُ</span> = muhrlaymiz &middot; <span class='w'>أَفْوَاهِهِمْ</span> = og'izlari (فَم + هِمْ)<br>&bull; <span class='w'>تُكَلِّمُنَا أَيْدِيهِمْ</span> = \"qo'llari Bizga so'zlaydi\" — so'z tartibiga e'tibor bering: fe'l avval, ega keyin keldi (Arabchada odatiy tartib) <span class='review'>&#8635; 20-dars</span><br>&bull; Bu oyat qiyomat kunida tilning yolg'on gapirishi mumkinligini, lekin a'zolarning haqiqatni yashira olmasligini ko'rsatadi — kunlik hayotda tilimizga qanchalik e'tibor berishimiz kerakligi haqida chuqur ogohlantirish"},
    {ref:"78–79-oyatlar — suyaklar bahsi", ar:"وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ ﴿٧٨﴾ قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ", meaning:"U Bizga masal keltirdi va o'z yaratilishini unutdi: \"Chirigan suyaklarni kim tiriltiradi?\" — dedi. Ayt: \"Ularni birinchi marta yaratgan Zot tiriltiradi — U har bir yaratishni Biluvchidir.\"",
     notes:"&bull; Rivoyatda — bir mushrik chirigan suyakni qo'lida ushqilab, Payg'ambar ﷺ oldiga kelib, \"buni Alloh tiriltiraradimi?\" deb masxara qilgan. Javob shu ikki oyatda.<br>&bull; <span class='w'>مَن يُحْيِي الْعِظَامَ</span> = \"suyaklarni kim tiriltiradi?\" — savol shaklida e'tiroz<br>&bull; <span class='w'>قُلْ</span> <span class='review'>&#8635; 3–6-darslar</span> = Ayt — javob buyrug'i<br>&bull; Javobning mantig'i juda oddiy va kuchli: birinchi marta yo'qdan yaratgan Zot uchun, allaqachon bir marta bo'lgan narsani qayta yaratish qiyinroq emas — aksincha, osonroq"},
    {ref:"82-oyat — Kun fayakun", ar:"إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ", meaning:"Uning ishi shuki, bir narsani xohlasa, unga faqat \"Bo'l!\" deydi — u bo'ladi.",
     notes:"&bull; <span class='w'>إِنَّمَا</span> = \"faqat, shunchaki\" — cheklovchi yuklama, yangi<br>&bull; <span class='w'>إِذَا أَرَادَ</span> <span class='review'>&#8635; إِذَا، 19-dars</span> = xohlagan vaqtda<br>&bull; <span class='w'>كُن فَيَكُونُ</span> = \"Bo'l! — va bo'ladi\" — Qur'ondagi eng qisqa va eng kuchli ikki so'zlardan biri. كُن — buyruq (\"bo'l\"), يَكُونُ — natija (\"bo'ladi\"), orasida vaqt yo'q"},
    {ref:"83-oyat — yakun", ar:"فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ", meaning:"Bas, har narsaning mulki qo'lida bo'lgan Zot pokdir — Unga qaytariladilar.",
     notes:"&bull; <span class='w'>سُبْحَانَ</span> = pok, nuqsonlardan xoli — tasbeh so'zining ildizi<br>&bull; <span class='w'>بِيَدِهِ</span> <span class='review'>&#8635; 21-dars, 1-oyat, Al-Mulk</span> — xuddi shu ibora bilan boshlangan surada takrorlanadi, ikkala sura ham \"mulk Uning qo'lida\" bilan boshlanadi/tugaydi<br>&bull; <span class='w'>تُرْجَعُونَ</span> = qaytariladilar — sura \"Bo'l\" bilan boshlangan hayotning, oxir-oqibat qaytish bilan tugashini eslatib yakunlaydi"}
  ],
  synth:"Yosinning uchta qismi — ogohlantirish, qissasi, dalil — aslida bitta savolga javob beradi: qayta tirilish mumkinmi? 78–79-oyatlardagi suyak masali va 82-oyatdagi \"Kun fayakun\" birgalikda javob beradi: Yaratgan Zot uchun birinchi marta yaratish ham, qayta yaratish ham bir xil — bitta so'z, bitta buyruq masalasi.",
  tafakkur:"Payg'ambar ﷺ dan rivoyat qilinadi: \"Har narsaning yuragi bor, Qur'onning yuragi — Yosindir.\" Ba'zi olimlar buni sura o'qilganda savob ko'payishi haqida tushunsalar, ko'plari buni suraning mazmuni bilan bog'laydi: xuddi yurak butun tanani tirik saqlagani kabi, Yosin ham imonning markaziy nuqtasi — qayta tirilish haqiqatini — yuraklarga jonlantiradi.<br><br>Shahar chekkasidan yugurib kelgan kishining qissasi (20–27-oyatlar) ham chuqur bir saboq: u hech kimni tanimagan, hech qanday mukofot va'da qilinmagan, hatto o'z qavmi tomonidan o'ldirilgan — lekin so'nggi nafasida ham qavmiga g'azab emas, faqat ularning ham najot topishini orzu qilgan. Bu — sizning ham, Qur'on o'rganishda faqat o'zingiz uchun emas, atrofingizdagilar uchun ham foyda tilashingiz kerakligi haqida yashirin da'vat.",
  talaffuz:"يَسْعَىٰ va تَجْرِي kabi fe'llarda oxirgi ى harfi (alif maqsura) — \"a\" tovushi bilan o'qiladi, lekin yozilishi ی shaklida. Buni ي (uzun \"i\") bilan aralashtirmang.",
  exercises:[
    {type:'mcq', kicker:'MASHQ 1 · OSON', q:"78–79-oyatlarda qanday e'tirozga javob berilyapti?", options:["Namoz vaqti haqida","Chirigan suyaklarni qayta tiriltirish mumkinligi haqida","Qur'onning tili haqida"], correct:1, explain:"Mushrik chirigan suyakni ko'rsatib, qayta tirilishni masxara qilgan — javob shunga berilgan."},
    {type:'reveal', kicker:'MASHQ 2 · O\'RTA', prompt:"كُن فَيَكُونُ iborasi nima uchun \"eng qisqa va kuchli\" deb ta'riflandi?", answer:"Ikki so'zda — buyruq (كُن) va natija (يَكُونُ) — orasida hech qanday vaqt yoki qiyinchilik yo'qligini ko'rsatadi."},
    {type:'match', kicker:'MASHQ 3 · O\'RTA · Ildizlarni bog\'lang', pairs:[{l:"جَاءَ",r:"16-darsdagi o'tgan zamon fe'li"},{l:"قُلْ",r:"3–6-darslardagi buyruq"},{l:"إِذَا",r:"19-darsdagi shart bog'lovchisi"}]},
    {type:'reveal', kicker:'MASHQ 4 · QIYIN', prompt:"Yosinning boshlanishi (1-oyat) va oxiri (83-oyat) orasida qanday mavzuiy bog'liqlik bor? \"بِيَدِهِ\" so'zini eslang.", answer:"1-oyatda Payg'ambarning haqligi qasam bilan tasdiqlanadi; 83-oyatda \"har narsa Uning qo'lida\" deb yakunlanadi — Al-Mulk (21-dars) surasi bilan bir xil ibora, ikkala sura ham Allohning mutlaq hukmronligini ta'kidlaydi."},
    {type:'reveal', kicker:'MASHQ 5 · QIYIN', prompt:"Qolgan oyatlarni (5–12, 14–19, 22–37, 41–64, 66–77, 80–81) to'liq Qur'on bo'limida oching va \"Shahar egalari\" qissasining oldingi qismini (14–19) o'qib, nima uchun elchilar rad etilganini toping.", answer:"O'zingizni sinang — 15–16-oyatlarda qavm elchilarni \"biz kabi odam\" deb rad etadi, elchilar esa Allohdan guvoh bo'lishini so'raydi."}
  ],
  vocab:{

    recognition:[["الْمُرْسَلِينَ","elchilar"],["سَدًّا","to'siq"],["يَسْعَىٰ","yuguradi"],["مُّهْتَدُونَ","to'g'ri yo'lda bo'lganlar"],["تَجْرِي","yuradi/oqadi"],["الْعِظَامَ","suyaklar"],["مَلَكُوتُ","mulk, hukmronlik"]]

    {ref:"1-qism", ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ", meaning:"Alloh — Undan boshqa iloh yo'q, U Hay (tirik), Qayyum (barchani qo'llab-quvvatlovchi)dir.",
     notes:"&bull; <span class='w'>لَا إِلَٰهَ إِلَّا هُوَ</span> <span class='review'>&#8635; 5-dars, Al-Ixlos naqshi</span> = \"Undan boshqa iloh yo'q\" — tavhidning eng qisqa ifodasi<br>&bull; <span class='w'>الْحَيُّ</span> = Hay, abadiy tirik — hech qachon o'lmaydigan, boshlanishi va oxiri yo'q hayot<br>&bull; <span class='w'>الْقَيُّومُ</span> = Qayyum — o'zi hech kimga muhtoj bo'lmagan, lekin butun borliq Unga muhtoj bo'lgan Zot. Bu ikki ism birga kelishi tasodifiy emas: Hay — Uning zoti mukammal ekanini, Qayyum — butun olamni ushlab turishini bildiradi"},
    {ref:"2-qism", ar:"لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ", meaning:"Uni na mudroq, na uyqu tutmaydi. Osmonlarda va yerda bor narsalarning barchasi Unikidir.",

    {ref:"3-qism", ar:"مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ", meaning:"Uning huzurida, Uning izmisiz kim shafoat qila oladi? U ularning oldida va ortida bo'lgan narsalarni biladi. Ular Uning ilmidan, U xohlagan narsadan boshqasini qamrab ololmaydilar.",
     notes:"&bull; <span class='w'>مَن ذَا الَّذِي</span> = \"kim bo'lardi, o'sha kim\" — kuchli ritorik savol qolipi, \"hech kim\" degan javobni allaqachon o'z ichiga oladi<br>&bull; <span class='w'>يَشْفَعُ</span> = shafoat qiladi &middot; <span class='w'>بِإِذْنِهِ</span> = \"Uning izni bilan\" — hatto shafoat ham Allohning ruxsatisiz bo'lmaydi<br>&bull; <span class='w'>لَا يُحِيطُونَ</span> = \"qamrab ololmaydilar\" — insonning ilmi, Allohning ilmi oldida cheklangan ekanini bildiradi"},

  synth:"Diqqat qiling — bu bitta oyatda Allohning 5 tadan ortiq sifati (Hay, Qayyum, Aliy, Azim va yashirin — Alim, Qodir) zich joylashgan, va deyarli har bir jumla oldingi darslarda ko'rgan naqshlar bilan qurilgan: لَا...إِلَّا (istisno, 7-dars), مَا (nisbiy olmosh), -هُ/-هِمْ oilasi (14-dars). Bitta oyat, lekin butun kursning naqshlari shu yerda jamlangan.",
  tafakkur:"Payg'ambar ﷺ Ubay ibn Ka'bdan so'raganlar: \"Alloh kitobida qaysi oyat eng buyuk?\" Ubay javob berganda (aynan shu oyat), Payg'ambar ﷺ ko'kragiga qo'l urib: \"Bu ilm senga muborak bo'lsin, ey Abu Munzir\" degan, deb rivoyat qilinadi. Boshqa rivoyatda, kim bu oyatni har namozdan keyin o'qisa, jannatga kirishiga o'lim bilan uning orasida faqat jonini olish qolishi aytiladi.<br><br>Bu oyatning markazidagi g'oya — Alloh hech qachon uxlamaydi, hech qachon charchamaydi, sizni hech qachon \"unutmaydi\". Kechasi yolg'iz his qilgan, kimga ham aytolmagan tashvishingiz bo'lsa, shuni biling: Qayyum bo'lgan Zot o'sha lahzada ham sizni ko'rib, biladi va ushlab turibdi.",
  talaffuz:"يَئُودُهُ so'zidagi ء (hamza) — tomoqning eng chuqur nuqtasidan chiqadigan to'xtash tovushi. Buni oddiy alif bilan aralashtirmang, chunki hamza mustaqil harakatga ega bo'lgan haqiqiy undosh hisoblanadi.",

  {id:"rule_sukun", kind:"rule", title:"Sukunni to'g'ri ulab o'qish", sub:"Aqraba so'zini aqoroba qilib yubormaslik", icon:"سْ",
   intro:"Sizga tanish savol: nega ba'zan أَقْرَبَ so'zi \"aqoroba\" bo'lib eshitiladi, \"aqraba\" o'rniga? Javob — sukun (ْ) belgisini noto'g'ri talaffuz qilishda. Sukun degani: bu harfda hech qanday unli tovush yo'q, u alohida bo'g'in emas — o'zining tovushini darhol keyingi harfga ulab, bitta nafasda aytish kerak. Harflarni birma-bir o'rganganda, har bir harfga beixtiyor ozgina unli qo'shib talaffuz qilish odati paydo bo'ladi (\"qof\" o'rniga \"qo\"...). Bu odat so'z ichida qolib ketsa, أَقْرَبَ kabi so'zlar buzilib qoladi. Bu darsda shu odatni tuzatamiz.",
   blocks:[
     {h:"1. Sukun — 'to'xtagan' harf, alohida bo'g'in emas", p:[
       "Harf ustidagi kichik doiracha (ْ) — sukun. Bu \"bu harfni unlisiz, faqat undosh tovush sifatida ayt\" degani. Og'iz shu harfning shaklini oladi, lekin ovoz cho'zilmaydi — darhol keyingi harfga o'tadi.",
       "Solishtiring: <span class='w'>قَ</span> (qa — to'liq bo'g'in, unlisi bor) va <span class='w'>قْ</span> (q — faqat undosh, o'zi bo'g'in bo'la olmaydi, albatta keyingi harfga yopishadi)."
     ]},
     {h:"2. Eng ko'p uchraydigan xato", p:[
       "أَقْرَبَ so'zini oling: أَ (a) + قْ (sukunli q) + رَ (ra) + بَ (ba). To'g'ri o'qilsa — \"aq-ra-ba\", uchta aniq bo'g'in. Xato — قْ harfiga o'zboshimchalik bilan qisqa unli qo'shib yuborish: natijada \"a-qo-ra-ba\", to'rtta bo'g'in bo'lib qoladi. Sabab odatda shu: harflarni yakka-yakka o'rgatishda har biriga tabiiy ravishda ozgina unli tovush ilashib qoladi, va bu odat butun so'zlarni o'qishga ko'chib qoladi.",
       "Davosi: قْ harfini alohida aytmang. رَ harfiga to'g'ridan-to'g'ri \"sakrab o'ting\" — ikkalasini deyarli bitta harakatda bog'lang."
     ]},
     {h:"3. Amalda: tanish so'zlarni qayta tekshiring", p:[
       "<span class='w'>نَسْتَعِينُ</span> (Fatiha, 5-oyat) <span class='review'>&#8635; 2-dars</span> — سْ harfida sukun bor, keyingi harf تَ ga ulanadi: \"nas-ta-'ii-nu\", \"na-sa-ta-'ii-nu\" emas.",
       "<span class='w'>أَنْعَمْتَ</span> (Fatiha, 7-oyat) <span class='review'>&#8635; 2-dars</span> — ikkita sukun bor: نْ (عга ulanadi) va مْ (تga ulanadi): \"an-'am-ta\", \"ana-'ama-ta\" emas.",
       "Diqqat: bu qoida so'z ICHIDAGI sukun uchun. Sukun so'z OXIRIDA kelib, undan keyin yangi so'z boshlansa (masalan نْ bilan tugab), butunlay boshqa, maxsus qoidalar ishga tushadi — buni keyingi darsda (Nun sokin qoidalari) chuqur ko'ramiz."
     ]}
   ],
   talaffuz:"Mashq usuli: so'zni juda sekin, harf-harf ayting, lekin sukunli harfda TO'XTAMANG — og'zingizni keyingi harfning shakliga tayyorlab turing va darhol o'ting. Keyin tezlikni asta-sekin oshiring, sukun hech qachon o'z-o'zidan bo'g'in bo'lib qolmasin.",
   tafakkur:"1-darsda o'qigan oyatni eslang: <span class='ar'>وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</span> — \"Qur'onni tartil bilan o'qi\" (Al-Muzzammil, 4). Tartil — shoshilmasdan, har bir harfni o'z joyiga qo'yib o'qish demakdir. Sukunni to'g'ri ulash — aynan shu tartilning eng kichik, lekin eng muhim g'ishtlaridan biri: bitta noto'g'ri qo'shilgan unli, butun so'zning vaznini o'zgartirib yuboradi.",
   exercises:[
     {type:'reveal', kicker:'TEKSHIRUV', prompt:"أَقْرَبَ so'zini uch bo'g'inga bo'ling va har bir bo'g'inni ayting: aq-ra-ba. Endi ق harfini alohida cho'zmasdan o'qib ko'ring.", answer:"أَ-قْ-رَ-بَ &rarr; \"aq\" + \"ra\" + \"ba\" — qْ hech qachon o'z ovoz bermaydi, darhol رَ ga o'tadi."},
     {type:'mcq', kicker:'MASHQ 1 · OSON', q:"أَقْرَبَ so'zining to'g'ri o'qilishi qaysi?", options:["aq-ra-ba","a-qo-ra-ba","aq-qa-ra-ba"], correct:0, explain:"قْ — sukunli harf, o'z unlisi yo'q, darhol رَ ga ulanadi: aq-ra-ba."},
     {type:'reveal', kicker:'MASHQ 2 · OSON', prompt:"نَسْتَعِينُ so'zida nechta sukun bor va qaysi harfda?", answer:"Bitta sukun — سْ harfida (na-s-ta-'ii-nu). تَ ga to'g'ridan-to'g'ri ulanadi."},
     {type:'mcq', kicker:'MASHQ 3 · O\'RTA', q:"أَنْعَمْتَ so'zida nechta sukun bor?", options:["1 ta","2 ta — نْ va مْ","3 ta"], correct:1, explain:"أَنْعَمْتَ = أَ + نْ + عَ + مْ + تَ — نْ (ع ga ulanadi) va مْ (تga ulanadi), ikkalasi ham sukunli."},
     {type:'reveal', kicker:'MASHQ 4 · O\'RTA', prompt:"هَلْ so'zini o'qing. لْ harfidan keyin hech narsa kelmasa (so'z shu yerda tugasa), uni qanday tugatish kerak?", answer:"لْ so'z oxirida sukun bilan tugaydi — \"hal\", \"halu\" yoki \"hali\" emas, undosh tovush bilan to'xtaydi."},
     {type:'match', kicker:'MASHQ 5 · QIYIN · Moslang', pairs:[
       {l:"أَقْرَبَ", r:"aq-ra-ba"}, {l:"نَسْتَعِينُ", r:"nas-ta-'iinu"}, {l:"أَنْعَمْتَ", r:"an-'am-ta"}, {l:"هَلْ", r:"hal"}
     ]},
     {type:'reveal', kicker:'MASHQ 6 · QIYIN', prompt:"Ovoz chiqarib o'qing: أَنْعَمْتَ عَلَيْهِمْ. Har ikkala sukunni (نْ, مْ) diqqat bilan ulashga harakat qiling, orada qo'shimcha unli qo'shmang.", answer:"an-'am-ta 'alayhim — sukunlar orasida hech qanday qo'shimcha unli tovush bo'lmasligi kerak."}
   ],

  {id:"rule_shams_qamar", kind:"rule", title:"Oy va quyosh harflari", sub:"Wattini, waltiyni emas", icon:"ال",
   intro:"اَل (\"al-\") — arab tilida \"the\" ma'nosidagi old qo'shimcha, deyarli har bir otga qo'shiladi. Lekin uning ل harfi har doim ham eshitilmaydi! Agar keyingi harf \"quyosh harfi\"dan bo'lsa, ل talaffuz qilinmaydi — o'rniga keyingi harf ikki baravar (shadda bilan) o'qiladi. وَالتِّينِ so'zini \"waltiyni\" emas, \"wattini\" deb o'qish — aynan shu qoida. Bu — Qur'onda eng ko'p uchraydigan, lekin ko'pincha e'tiborsiz qoldiriladigan qoidalardan biri.",
   blocks:[
     {h:"1. Eng ishonchli belgi: shadda", p:[
       "Yozuvning o'zida ipuchi bor: agar ل dan keyingi harf ustida shadda (ّ) tursa — ل o'qilmaydi, harf ikki baravar aytiladi. Agar ل ustida sukun (ْ) tursa — ل oddiy o'qiladi.",
       "Solishtiring: <span class='w'>الْقَمَرِ</span> — لْ ustida sukun, oddiy o'qiladi: \"al-qamari\". <span class='w'>الشَّمْسِ</span> — ش ustida shadda, ل o'qilmaydi: \"ash-shamsi\", \"al-shamsi\" emas."
     ]},
     {h:"2. Quyosh harflari (14 ta) — ل erib ketadi", p:[
       "<span class='w' style='font-size:1.15em;'>ت ث د ذ ر ز س ش ص ض ط ظ ل ن</span> — shu 14 harfdan birortasi ال dan keyin kelsa, ل talaffuz qilinmaydi, harf ikki baravar (shadda bilan) o'qiladi.",
       "Tanish misollar: <span class='w'>وَالتِّينِ</span> = \"wat-tiini\" (waltiyni emas) &middot; <span class='w'>النَّاسِ</span> <span class='review'>&#8635; 3-dars</span> = \"an-naasi\" &middot; <span class='w'>الرَّحْمَٰنِ</span> <span class='review'>&#8635; 1, 2-dars</span> = \"ar-rahmaani\" &middot; <span class='w'>الصِّرَاطَ</span> <span class='review'>&#8635; 2-dars</span> = \"as-siraata\" &middot; <span class='w'>الضَّالِّينَ</span> <span class='review'>&#8635; 2-dars</span> = \"ad-daalliina\"."
     ]},
     {h:"3. Oy harflari (14 ta) — ل oddiy eshitiladi", p:[
       "<span class='w' style='font-size:1.15em;'>ا ب ج ح خ ع غ ف ق ك م ه و ي</span> — qolgan 14 harf. Bulardan birortasi ال dan keyin kelsa, ل oddiy, o'z holicha eshitiladi.",
       "Tanish misollar: <span class='w'>الْحَمْدُ</span> <span class='review'>&#8635; 2-dars</span> = \"al-hamdu\" &middot; <span class='w'>الْعَالَمِينَ</span> <span class='review'>&#8635; 2-dars</span> = \"al-'aalamiina\" &middot; <span class='w'>الْمُسْتَقِيمَ</span> <span class='review'>&#8635; 2-dars</span> = \"al-mustaqiima\"."
     ]}
   ],

   grammar:[
     {h:"1. Ismli gap (bo'lmoq fe'lisiz)", p:[
       "Arabchada hozirgi zamonda \"bo'lmoq\" (is/are) fe'li YOZILMAYDI. <span class='w'>هَذَا بَيْتٌ</span> so'zma-so'z \"bu uy\" — lekin ma'nosi \"bu — uy(dir)\". Ikkita so'z ketma-ket kelsa, orasida \"—\" (bo'lmoq) borligini tushunib olamiz.",
       "<span class='w'>هَذَا</span> (haaza) — \"bu\". So'z oxiridagi kichik \" ٌ \" belgisi (tanvin) — \"bir, qandaydir\" ma'nosini beradi: <span class='w'>كِتَابٌ</span> = \"bir kitob\". Bu belgi haqida keyingi darsda ham gaplashamiz."
     ]},
     {h:"2. مَا هَذَا؟ — \"Bu nima?\"", p:[
       "Narsa haqida so'rash uchun <span class='w'>مَا</span> (nima) ishlatiladi: <span class='w'>مَا هَذَا؟</span> = \"Bu nima?\" Javobda ham هَذَا qaytariladi: <span class='w'>هَذَا قَلَمٌ</span> = \"Bu — qalam\"."
     ]},
     {h:"3. Ha/yo'q savoli: أَ harfi bilan", p:[
       "Gap boshiga <span class='w'>أَ</span> harfini qo'shib \"...mi?\" savoli yasaladi (bu — hamza, alohida so'z emas, keyingi so'zga yopishadi): <span class='w'>أَهَذَا بَيْتٌ؟</span> = \"Bu uymi?\"",
       "Javob: <span class='w'>نَعَمْ</span> (ha) yoki <span class='w'>لاَ</span> (yo'q), odatda to'liq javob bilan birga: <span class='w'>نَعَمْ، هَذَا بَيْتٌ</span> (Ha, bu — uy) yoki <span class='w'>لاَ، هَذَا مَسْجِدٌ</span> (Yo'q, bu — masjid)."
     ]}
   ],
   examples:[
     {ar:"هَذَا كِتَابٌ.", uz:"Bu — kitob."},
     {ar:"أَهَذَا قَلَمٌ؟ نَعَمْ، هَذَا قَلَمٌ.", uz:"Bu qalammi? Ha, bu — qalam."},
     {ar:"أَهَذَا حِصَانٌ؟ لاَ، هَذَا حِمَارٌ.", uz:"Bu otmi? Yo'q, bu — eshak."},
     {ar:"مَا هَذَا؟ هَذَا مِفْتَاحٌ.", uz:"Bu nima? Bu — kalit."},
     {ar:"هَذَا طَالِبٌ، وَهَذَا مُدَرِّسٌ.", uz:"Bu — talaba, va bu — o'qituvchi."}
   ],

  {id:"md2", title:"2-dars: Anavi kim/nima?", sub:"ذَلِكَ, مَنْ, أَذَلِكَ؟",
   intro:"هَذَا — YAQINDAGI narsa uchun (\"bu\"). Bu darsda UZOQDAGI narsa uchun \"anavi/o'sha\" so'zini — ذَلِكَ — o'rganasiz, ikkalasini bir gapda solishtirishni, va ODAMLAR haqida so'rashni (مَنْ — kim?).",
   grammar:[
     {h:"1. ذَلِكَ — \"anavi, o'sha\"", p:[
       "<span class='w'>ذَلِكَ</span> (zaalika) — uzoqdagi narsa/kishi: \"anavi\". Naqsh xuddi هَذَا bilan bir xil: <span class='w'>ذَلِكَ بَيْتٌ</span> = \"Anavi — uy\", <span class='w'>مَا ذَلِكَ؟</span> = \"Anavi nima?\"",
       "أَ bilan savol ham xuddi shunday: <span class='w'>أَذَلِكَ كَلْبٌ؟</span> = \"Anavi itmi?\" Javob: <span class='w'>نَعَمْ</span>/<span class='w'>لاَ</span>."
     ]},
     {h:"2. هَذَا... وَذَلِكَ... — ikkitasini solishtirish", p:[
       "Ikki narsani bir gapda solishtirish uchun هَذَا va ذَلِكَ ni وَ (\"va\") bilan bog'lab ishlatasiz: <span class='w'>هَذَا بَيْتٌ، وَذَلِكَ مَسْجِدٌ</span> = \"Bu — uy, anavi — masjid\". Bu — yaqin va uzoqdagi ikki narsani bitta gapda ko'rsatishning eng tabiiy yo'li."
     ]},
     {h:"3. مَنْ — odamlar haqida savol", p:[
       "Narsalar uchun مَا (nima), ODAMLAR uchun esa <span class='w'>مَنْ</span> (kim) ishlatiladi: <span class='w'>مَنْ هَذَا؟</span> = \"Bu kim?\", <span class='w'>مَنْ هَذَا وَمَنْ ذَلِكَ؟</span> = \"Bu kim va anavi kim?\" — ikkalasini bir savolda ham so'rash mumkin."
     ]}
   ],
   examples:[
     {ar:"هَذَا بَيْتٌ، وَذَلِكَ مَسْجِدٌ.", uz:"Bu — uy, anavi — masjid."},
     {ar:"مَا ذَلِكَ؟ ذَلِكَ حَجَرٌ.", uz:"Anavi nima? Anavi — tosh."},
     {ar:"أَذَلِكَ كَلْبٌ؟ لاَ، ذَلِكَ قِطٌّ.", uz:"Anavi itmi? Yo'q, anavi — mushuk."},
     {ar:"مَنْ هَذَا وَمَنْ ذَلِكَ؟ هَذَا طَبِيبٌ وَذَلِكَ إِمَامٌ.", uz:"Bu kim va anavi kim? Bu — shifokor, anavi — imom."},
     {ar:"هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ.", uz:"Bu — shakar, anavi — sut."}
   ],
   vocab:[
     {ar:"حَجَرٌ", tr:"hajarun", uz:"tosh"}, {ar:"سُكَّرٌ", tr:"sukkarun", uz:"shakar"},
     {ar:"لَبَنٌ", tr:"labanun", uz:"sut"}, {ar:"إِمَامٌ", tr:"imoomun", uz:"imom"},
   ]},
  {id:"md3", title:"3-dars: Aniq va noaniq. Qanday?", sub:"الْ, sifatlar bilan tasvirlash",
   intro:"Shu paytgacha barcha so'zlar oxirida tanvin (ٌ) bo'lgan — \"bir, qandaydir\" ma'nosida. Bu darsda so'zni ANIQ (\"aynan shu\") qilib ko'rsatuvchi الْ prefiksini chuqur o'rganasiz, va uni sifatlar bilan birga ishlatib, tasvirlovchi gaplar tuzishni: \"(aynan shu) eshik — ochiq\" kabi.",
   grammar:[
     {h:"1. Noaniq (-ٌ) va aniq (الْ)", p:[
       "<span class='w'>كِتَابٌ</span> = \"bir kitob\" (noaniq — qaysi kitob ekani muhim emas). <span class='w'>الْكِتَابُ</span> = \"(aynan shu/o'sha) kitob\" (aniq — gapiruvchi ham, tinglovchi ham qaysi kitob ekanini biladi). الْ qo'shilganda tanvin tushib qoladi, oxiriga oddiy damma (ُ) qoladi.",
       "Solishtiring: <span class='w'>بَابٌ</span> (bir eshik) &rarr; <span class='w'>الْبَابُ</span> (o'sha eshik); <span class='w'>وَلَدٌ</span> (bir bola) &rarr; <span class='w'>الْوَلَدُ</span> (o'sha bola). <span class='review'>&#8635; Oy va quyosh harflari darsida bu qoidani chuqur ko'rgansiz</span>."
     ]},
     {h:"2. [Aniq ot] + [sifat] = tasvirlovchi gap", p:[
       "Endi هَذَا/ذَلِكَ o'rniga ANIQ otning o'zini gap boshiga qo'yib, keyin sifat qo'shib \"X — Y(dir)\" gapini tuzish mumkin: <span class='w'>الْبَابُ مَفْتُوحٌ</span> = \"Eshik — ochiq\". Diqqat: ot ANIQ (الْ bilan), sifat esa NOANIQ (tanvin bilan) qoladi — bu qoidaga har doim rioya qilinadi.",
       "Ikkita tasvirni solishtirish uchun ham وَ ishlatiladi: <span class='w'>الْكُرْسِيُّ كَبِيرٌ، وَالْمِفْتَاحُ صَغِيرٌ</span> = \"Stul — katta, kalit — kichik\"."
     ]},
     {h:"3. Yangi sifatlar", p:[
       "Holat sifatlari: <span class='w'>مَفْتُوحٌ</span> (ochiq) / <span class='w'>مَكْسُورٌ</span> (singan), <span class='w'>جَالِسٌ</span> (o'tirgan) / <span class='w'>وَاقِفٌ</span> (turgan).",
       "Zid ma'noli juftliklar: <span class='w'>كَبِيرٌ</span>/<span class='w'>صَغِيرٌ</span> (katta/kichik), <span class='w'>جَدِيدٌ</span>/<span class='w'>قَدِيمٌ</span> (yangi/eski), <span class='w'>طَوِيلٌ</span>/<span class='w'>قَصِيرٌ</span> (uzun/qisqa), <span class='w'>غَنِيٌّ</span>/<span class='w'>فَقِيرٌ</span> (boy/kambag'al)."
     ]}
   ],
   examples:[
     {ar:"الْبَابُ مَفْتُوحٌ.", uz:"Eshik — ochiq."},
     {ar:"الْقَلَمُ مَكْسُورٌ.", uz:"Qalam — singan."},
     {ar:"الْكُرْسِيُّ كَبِيرٌ، وَالْمِفْتَاحُ صَغِيرٌ.", uz:"Stul — katta, kalit — kichik."},
     {ar:"الْكِتَابُ جَدِيدٌ، وَالْقَمِيصُ قَدِيمٌ.", uz:"Kitob — yangi, ko'ylak — eski."},

     {ar:"التَّاجِرُ غَنِيٌّ.", uz:"Savdogar — boy."}
   ],

  {id:"md4", title:"4-dars: U qayerda?", sub:"هُوَ/هِيَ, فِي/عَلَى, أَيْنَ",
   intro:"Bir narsani ikkinchi marta eslatganda, uni qayta nomlash shart emas — \"u\" olmoshi bilan almashtiriladi. Bu darsda هُوَ/هِيَ olmoshlarini, joy bildiruvchi فِي/عَلَى predloglarini va ularni أَيْنَ savoliga javob berishda qanday ishlatishni o'rganasiz.",
   grammar:[
     {h:"1. هُوَ va هِيَ — \"u\"", p:[
       "<span class='w'>هُوَ</span> — erkak jinsli yoki jinssiz narsa/kishi uchun \"u\": <span class='w'>هَذَا قَلَمٌ. هُوَ جَدِيدٌ.</span> (Bu — qalam. U — yangi.)",
       "<span class='w'>هِيَ</span> — ayol jinsli narsa/kishi uchun \"u\": <span class='w'>هَذِهِ سَاعَةٌ. هِيَ جَمِيلَةٌ.</span> — bu misolda هَذِهِ dan foydalanildi, lekin uni to'liq keyingi darsda o'rganasiz; hozircha faqat هِيَ olmoshiga e'tibor bering."
     ]},
     {h:"2. فِي va عَلَى — joy predloglari", p:[
       "<span class='w'>فِي</span> = \"-da, ichida\": <span class='w'>هُوَ فِي الْبَيْتِ</span> = \"U — uyda\". <span class='w'>عَلَى</span> = \"ustida\": <span class='w'>هُوَ عَلَى الْمَكْتَبِ</span> = \"U — stol ustida\".",
       "Diqqat: predlogdan keyingi ot har doim ANIQ (الْ bilan) va OXIRI KASRA (ِ) bilan keladi: فِي الْبَيْتِ (bayti emas, baytI — oxiri kasra)."
     ]},
     {h:"3. أَيْنَ...؟ — \"qayerda?\"", p:[
       "<span class='w'>أَيْنَ الْقَلَمُ؟</span> = \"Qalam qayerda?\" Javobda ot takrorlanmaydi, o'rniga هُوَ/هِيَ ishlatiladi: <span class='w'>هُوَ فِي الْحَقِيبَةِ</span> (U — sumkada), qayta \"الْقَلَمُ فِي الْحَقِيبَةِ\" deyish shart emas."
     ]}
   ],
   examples:[
     {ar:"أَيْنَ الْمُدَرِّسُ؟ هُوَ فِي الْمَسْجِدِ.", uz:"O'qituvchi qayerda? U — masjidda."},
     {ar:"أَيْنَ السَّاعَةُ؟ هِيَ عَلَى الْمَكْتَبِ.", uz:"Soat qayerda? U — stol ustida."},
     {ar:"هُوَ فِي الْمَطْبَخِ.", uz:"U — oshxonada."},
     {ar:"أَيْنَ الْقَلَمُ؟ هُوَ فِي الْحَقِيبَةِ.", uz:"Qalam qayerda? U — sumkada."},
     {ar:"الطَّبِيبُ فِي الْحَمَّامِ؟ لاَ، هُوَ فِي الْغُرْفَةِ.", uz:"Shifokor hammomdami? Yo'q, u — xonada."}
   ],

  {id:"md5", title:"5-dars: Kimniki bu?", sub:"Izofa (egalik), تَحْتَ, لِمَنْ",
   intro:"Bu darsda \"X ning Y-si\" ma'nosini beruvchi IZOFA qurilishini — arab tilidagi eng ko'p ishlatiladigan naqshlardan birini — o'rganasiz, yana bir joy predlogi (تَحْتَ — ostida) va \"kimniki?\" savolini.",
   grammar:[
     {h:"1. Izofa — \"X ning Y-si\"", p:[
       "Ikkita ot yonma-yon qo'yilsa, BIRINCHISI tanvinsiz-الsiz, IKKINCHISI esa الْ bilan (yoki atoqli ism) kelsa — \"birinchisi ikkinchisiga tegishli\" ma'nosi hosil bo'ladi, \"ning\" so'zi hech qachon yozilmaydi: <span class='w'>قَلَمُ الطَّالِبِ</span> = \"talabaning qalami\".",
       "Agar ikkinchi so'z atoqli ism bo'lsa, الْ kerak emas — ism o'zi aniq: <span class='w'>كِتَابُ بِلاَلٍ</span> = \"Bilolning kitobi\". Diqqat: izofada BIRINCHI so'zga hech qachon الْ QO'SHILMAYDI."
     ]},
     {h:"2. تَحْتَ — \"ostida\"", p:[
       "Yana bir joy predlogi: <span class='w'>تَحْتَ</span> = \"ostida\": <span class='w'>الْقِطُّ تَحْتَ السَّرِيرِ</span> = \"Mushuk — karavot ostida\". Endi uchta predlog bilasiz: فِي (ichida), عَلَى (ustida), تَحْتَ (ostida)."
     ]},
     {h:"3. لِمَنْ...؟ — \"kimniki?\"", p:[
       "<span class='w'>لِمَنْ</span> (kimga/kimniki) + ot bilan egalikni so'rash mumkin: <span class='w'>لِمَنْ هَذَا الْقَلَمُ؟</span> = \"Bu qalam kimniki?\" Javobda izofa ishlatiladi: <span class='w'>هَذَا قَلَمُ الْمُدَرِّسِ</span> (Bu — o'qituvchining qalami)."
     ]}
   ],
   examples:[
     {ar:"هَذَا كِتَابُ بِلاَلٍ.", uz:"Bu — Bilolning kitobi."},
     {ar:"أَيْنَ قَلَمُ الْمُدَرِّسِ؟ هُوَ عَلَى الْمَكْتَبِ.", uz:"O'qituvchining qalami qayerda? U — stol ustida."},

     {ar:"لِمَنْ هَذَا الدَّفْتَرُ؟ هَذَا دَفْتَرُ الطَّالِبِ.", uz:"Bu daftar kimniki? Bu — talabaning daftari."},
     {ar:"أَيْنَ حَقِيبَةُ الطَّالِبِ؟ هِيَ تَحْتَ الْمَكْتَبِ.", uz:"Talabaning sumkasi qayerda? U — stol ostida."}
   ],

  {id:"md6", title:"6-dars: Bu (ayol jinsi)", sub:"هَذِهِ, kasblarning ayol shakli",
   intro:"Bu darsda ayol jinsli \"bu\" — هَذِهِ — ni, va ko'plab kasb/sifat so'zlarining ERKAK shaklidan AYOL shaklini qanday yasashni (odatda oxiriga ة qo'shib) o'rganasiz.",
   grammar:[
     {h:"1. هَذِهِ — ayol jinsi uchun \"bu\"", p:[
       "<span class='w'>هَذِهِ</span> (haazihi) — \"bu\", AYOL jinsli narsa/kishi uchun: <span class='w'>هَذِهِ سَيَّارَةٌ</span> = \"Bu — mashina\". هَذَا/هَذِهِ tanlovi otning jinsiga bog'liq, ma'noga emas."
     ]},
     {h:"2. Kasb va sifatlarning ayol shakli", p:[
       "Ko'pchilik erkak jinsli kasb/sifat so'ziga oxiriga <span class='w'>ة</span> qo'shib ayol shakli yasaladi: <span class='w'>مُهَنْدِسٌ</span> (muhandis, erkak) &rarr; <span class='w'>مُهَنْدِسَةٌ</span> (muhandis, ayol); <span class='w'>طَبِيبٌ</span> &rarr; <span class='w'>طَبِيبَةٌ</span>. Lekin مُمَرِّضَةٌ (hamshira) kabi ba'zi so'zlar odatda faqat ayol shaklida ishlatiladi."
     ]},
     {h:"3. لِمَنْ...؟ — davomi", p:[
       "Endi هَذِهِ bilan ham \"kimniki?\" so'rash mumkin: <span class='w'>لِمَنْ هَذِهِ السَّيَّارَةُ؟</span> = \"Bu mashina kimniki?\" Javob: <span class='w'>هَذِهِ سَيَّارَةُ الْمُدِيرِ</span> (Bu — direktorning mashinasi)."
     ]}
   ],
   examples:[
     {ar:"هَذِهِ أُخْتُ الطَّالِبِ.", uz:"Bu — talabaning singlisi."},
     {ar:"مَنْ هَذِهِ؟ هَذِهِ طَبِيبَةٌ.", uz:"Bu kim? Bu — ayol shifokor."},
     {ar:"أَهِيَ مُمَرِّضَةٌ؟ لاَ، هِيَ مُهَنْدِسَةٌ.", uz:"U hamshirami? Yo'q, u — muhandis (ayol)."},
     {ar:"لِمَنْ هَذِهِ السَّيَّارَةُ؟ هَذِهِ سَيَّارَةُ الْمُدِيرِ.", uz:"Bu mashina kimniki? Bu — direktorning mashinasi."},
     {ar:"مَا هَذِهِ؟ هَذِهِ مِكْوَاةٌ.", uz:"Bu nima? Bu — dazmol."}
