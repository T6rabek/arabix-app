  {id:"md7", title:"7-dars: Anavi (ayol jinsi). Qayerlik?", sub:"تِلْكَ, مِنَ + mamlakat",
   intro:"هَذِهِ — YAQINDAGI ayol jinsli narsa uchun. Bu darsda UZOQDAGI ayol jinsli narsa uchun تِلْكَ ni, kishining qayerdanligini so'rashni (مِنَ + mamlakat), va ayol jinsli sifatlarning davomini o'rganasiz.",
   grammar:[
     {h:"1. تِلْكَ — ayol jinsi uchun \"anavi\"", p:[
       "<span class='w'>تِلْكَ</span> (tilka) — uzoqdagi AYOL jinsli narsa/kishi: \"anavi\". هَذِهِ/تِلْكَ ning jinsga qarab tanlanishi xuddi هَذَا/ذَلِكَ bilan bir xil mantiqda ishlaydi."
     ]},
     {h:"2. مِنَ + mamlakat — qayerdanligi", p:[
       "<span class='w'>مِنْ</span> (-dan) + mamlakat nomi bilan kelib chiqishni bildirish mumkin: <span class='w'>هِيَ مِنَ الْهِنْدِ</span> = \"U — Hindistondan\". (مِنْ so'zidan keyingi harf \"ال\" bilan boshlansa, ba'zan مِنَ shaklida talaffuz qilinadi — kichik tovush moslashuvi.)"
     ]},
     {h:"3. Sifatlarning ayol shakli — davomi", p:[
       "Oldingi darsda ko'rgan qoida shu yerda ham ishlaydi: <span class='w'>طَوِيلٌ</span> (baland, erkak) &rarr; <span class='w'>طَوِيلَةٌ</span> (baland, ayol); <span class='w'>قَصِيرٌ</span> &rarr; <span class='w'>قَصِيرَةٌ</span>. Ot va sifat jinsda har doim mos kelishi kerak."
     ]}
   ],
   examples:[
     {ar:"هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ.", uz:"Bu — ayol shifokor, anavi — hamshira."},
     {ar:"هَذِهِ مِنَ الْهِنْدِ وَتِلْكَ مِنَ الْيَابَانِ.", uz:"Bu — Hindistondan, anavi — Yaponiyadan."},
     {ar:"أَتِلْكَ دَجَاجَةٌ؟ لاَ، تِلْكَ بَطَّةٌ.", uz:"Anavi tovuqmi? Yo'q, anavi — o'rdak."},
     {ar:"هَذِهِ طَوِيلَةٌ وَتِلْكَ قَصِيرَةٌ.", uz:"Bu — baland bo'yli, anavi — past bo'yli."},
     {ar:"مَنْ هَذِهِ وَمَنْ تِلْكَ؟ هَذِهِ زَيْنَبُ وَتِلْكَ خَدِيجَةُ.", uz:"Bu kim va anavi kim? Bu — Zaynab, anavi — Xadicha."}
   ],
   vocab:[
     {ar:"الْهِنْدُ", tr:"alhindu", uz:"Hindiston"}, {ar:"الْيَابَانُ", tr:"alyoobonu", uz:"Yaponiya"},
     {ar:"دَجَاجَةٌ", tr:"dajoojatun", uz:"tovuq"}, {ar:"بَطَّةٌ", tr:"battatun", uz:"o'rdak"},
     {ar:"نَاقَةٌ", tr:"naaqatun", uz:"urg'ochi tuya"}, {ar:"مُؤَذِّنٌ", tr:"mu'azzinun", uz:"azonchi"},
     {ar:"حَدِيقَةٌ", tr:"hadiiqatun", uz:"bog'"}, {ar:"بَيْضَةٌ", tr:"bayzatun", uz:"tuxum"},
   ]},
  {id:"md8", title:"8-dars: Ismi nima? Oldida, orqasida", sub:"اسْمُ..., أَمَامَ/خَلْفَ, لِـ egalik",
   intro:"Bu darsda ism haqida izofa bilan so'rashni (اسْمُ...), ikkita yangi joy predlogini (أَمَامَ — oldida, خَلْفَ — orqasida), va egalikni لِـ predlogi orqali bildirishning yana bir yo'lini o'rganasiz.",
   grammar:[
     {h:"1. اسْمُ + ot — \"...ning ismi\"", p:[
       "اسْم (ism) so'zi izofada ishlatilib, kimningdir ismini so'rash/aytish mumkin: <span class='w'>اسْمُ الطَّالِبِ بِلاَلٌ</span> = \"Talabaning ismi — Bilol\". Bu — izofa qoidasining yana bir amaliy qo'llanilishi."
     ]},
     {h:"2. أَمَامَ va خَلْفَ — yana ikki joy predlogi", p:[
       "<span class='w'>أَمَامَ</span> = \"oldida\": <span class='w'>الْبَيْتُ أَمَامَ الْمَسْجِدِ</span> (Uy — masjid oldida). <span class='w'>خَلْفَ</span> = \"orqasida\": <span class='w'>السَّيَّارَةُ خَلْفَ الْمَدْرَسَةِ</span> (Mashina — maktab orqasida). Endi beshta joy predlogini bilasiz: فِي، عَلَى، تَحْتَ، أَمَامَ، خَلْفَ."
     ]},
     {h:"3. لِـ + ot — egalikning yana bir yo'li", p:[
       "Izofadan tashqari, egalikni <span class='w'>لِـ</span> (-ga tegishli) predlogi bilan ham bildirish mumkin: <span class='w'>هَذَا الْكِتَابُ لِلطَّالِبِ</span> = \"Bu kitob — talabaga tegishli\". Ikkita savolni birga berish ham mumkin: <span class='w'>لِمَنْ هَذَا وَلِمَنْ ذَلِكَ؟</span> (Bu kimniki va anavi kimniki?)"
     ]}
   ],
   examples:[
     {ar:"اسْمُ الطَّالِبِ بِلاَلٌ.", uz:"Talabaning ismi — Bilol."},
     {ar:"اسْمُ الطَّبِيبَةِ زَيْنَبُ.", uz:"Ayol shifokorning ismi — Zaynab."},
     {ar:"الْبَيْتُ أَمَامَ الْمَسْجِدِ.", uz:"Uy — masjid oldida."},
     {ar:"السَّيَّارَةُ خَلْفَ الْمَدْرَسَةِ.", uz:"Mashina — maktab orqasida."},
     {ar:"هَذَا الْكِتَابُ لِلطَّالِبِ.", uz:"Bu kitob — talabaga tegishli."},
     {ar:"لِمَنْ هَذَا الْقَلَمُ وَلِمَنْ ذَلِكَ الدَّفْتَرُ؟ هَذَا لِلْمُدَرِّسِ وَذَلِكَ لِلطَّالِبِ.", uz:"Bu qalam kimga va anavi daftar kimga tegishli? Bu — o'qituvchiga, anavi — talabaga."}
   ],
   vocab:[
     {ar:"اسْمٌ", tr:"ismun", uz:"ism"}, {ar:"أَمَامَ", tr:"amooma", uz:"oldida"},

     {ar:"أَلْمَانِيَا", tr:"almaaniyaa", uz:"Germaniya"}, {ar:"العِرَاقُ", tr:"al'iraaqu", uz:"Iroq"},
     {ar:"إِنْكِلْتِرَا", tr:"inkiltiraa", uz:"Angliya"}, {ar:"سُوَيْسْرَا", tr:"suvaysraa", uz:"Shveytsariya"},
     {ar:"المُسْتَشْفَى", tr:"almustashfaa", uz:"kasalxona"}, {ar:"ذَهَبَ", tr:"zahaba", uz:"bordi"},
     {ar:"إِلَى", tr:"ilaa", uz:"tomon, -ga"}, {ar:"فَرَنْسَا", tr:"faransaa", uz:"Fransiya"},

  {id:"md9", title:"9-dars: U — kim va nima ekanini aytish", sub:"Atoqli ot + xabar, ot+sifat birga",
   intro:"Shu paytgacha har bir gap هَذَا/ذَلِكَ/هُوَ bilan boshlangan. Bu darsda ATOQLI ISMNI to'g'ridan-to'g'ri gap boshiga qo'yib xabar berishni, va ikki so'zdan iborat xabar (ot + sifat birga: \"boy savdogar\") tuzishni o'rganasiz.",
   grammar:[
     {h:"1. Atoqli ot + xabar — ko'rsatish so'zisiz", p:[
       "Ism allaqachon ANIQ (kimni nazarda tutayotganingiz aniq), shuning uchun هَذَا kerak emas — to'g'ridan-to'g'ri: <span class='w'>بِلاَلٌ طَالِبٌ</span> = \"Bilol — talaba\"."
     ]},
     {h:"2. Ot + sifat birga — ikki so'zli xabar", p:[
       "Xabarni ot + sifat qilib kengaytirish mumkin, ikkalasi ham noaniq (tanvin bilan) qoladi: <span class='w'>بِلاَلٌ طَالِبٌ جَدِيدٌ</span> = \"Bilol — yangi talaba\" (so'zma-so'z: \"Bilol — talaba, yangi\")."
     ]},
     {h:"3. Umumiy haqiqat gaplari", p:[
       "Ushbu naqsh umumiy haqiqatlarni aytish uchun ham ishlatiladi: [ANIQ ot] + [noaniq ot + sifat]: <span class='w'>التُّفَّاحُ فَاكِهَةٌ لَذِيذَةٌ</span> = \"Olma — mazali meva\". <span class='w'>الْعُصْفُورُ طَائِرٌ صَغِيرٌ</span> = \"Chumchuq — kichik qush\"."
     ]}
   ],
   examples:[
     {ar:"بِلاَلٌ طَالِبٌ جَدِيدٌ.", uz:"Bilol — yangi talaba."},
     {ar:"زَيْنَبُ طَبِيبَةٌ طَوِيلَةٌ.", uz:"Zaynab — baland bo'yli shifokor."},
     {ar:"هَذَا تُفَّاحٌ. التُّفَّاحُ فَاكِهَةٌ لَذِيذَةٌ.", uz:"Bu — olma. Olma — mazali meva."},

  {id:"md10", title:"10-dars: Men, sen. Mening ismim...", sub:"أَنَا/أَنْتَ, egalik qo'shimchalari -ي/-كَ/-هُ",
   intro:"Bu darsda arab tilida SUHBATLASHISHNI boshlaysiz: \"men\" va \"sen\" olmoshlarini, va otga bevosita yopishadigan egalik qo'shimchalarini (\"mening\", \"sening\", \"uning\") — bu 1-3-darslardagi Grammatika bo'limida ko'rgan mavzuning davomi.",
   grammar:[
     {h:"1. أَنَا va أَنْتَ — \"men\" va \"sen\"", p:[
       "<span class='w'>أَنَا</span> = \"men\": <span class='w'>أَنَا طَالِبٌ</span> = \"Men — talabaman\". <span class='w'>أَنْتَ</span> = \"sen\" (erkakka): <span class='w'>أَأَنْتَ طَالِبٌ جَدِيدٌ؟</span> = \"Sen yangi talabamisan?\" (أَ + أَنْتَ = ha/yo'q savoli, 1-darsda ko'rgan qoida shu yerda ham ishlaydi)."
     ]},
     {h:"2. Egalik qo'shimchalari: -ي، -كَ، -هُ", p:[
       "Egalik olmoshlari (\"mening\", \"sening\", \"uning\") ALOHIDA so'z emas — otning OXIRIGA to'g'ridan-to'g'ri yopishadi: <span class='w'>اسْمِي</span> = \"mening ismim\" (-ي = mening), <span class='w'>اسْمُكَ</span> = \"sening isming\" (-كَ = sening), <span class='w'>اسْمُهُ</span> = \"uning ismi\" (-هُ = uning).",
       "Savol-javob: <span class='w'>مَا اسْمُكَ؟</span> (Sening isming nima?) &rarr; <span class='w'>اسْمِي بِلاَلٌ</span> (Mening ismim — Bilol). <span class='review'>&#8635; Grammatika bo'limida bu qo'shimchalarni chuqurroq ko'rasiz</span>."
     ]},
     {h:"3. الَّذِي — \"...gan/...adigan\"", p:[
       "<span class='w'>الَّذِي</span> kichik bog'lovchi so'z, bir jumlani boshqasiga bog'laydi: <span class='w'>مَنْ هَذَا الَّذِي مَعَكَ؟</span> = \"Sen bilan bo'lgan bu kim?\" (so'zma-so'z: \"kim — bu, sen bilan bo'lgan\"). <span class='w'>مَعَ</span> = \"bilan\"."
     ]}
   ],
   examples:[
     {ar:"مَنْ أَنْتَ؟ أَنَا طَالِبٌ بِالْجَامِعَةِ.", uz:"Sen kimsan? Men — universitet talabasiman."},
     {ar:"أَأَنْتَ طَالِبٌ جَدِيدٌ؟ نَعَمْ، أَنَا طَالِبٌ جَدِيدٌ.", uz:"Sen yangi talabamisan? Ha, men — yangi talabaman."},
     {ar:"مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنْ أُوزْبَكِسْتَانَ.", uz:"Sen qayerdansan? Men — O'zbekistondanman."},
     {ar:"مَا اسْمُكَ؟ اسْمِي بِلاَلٌ.", uz:"Sening isming nima? Mening ismim — Bilol."},
     {ar:"مَنْ هَذَا الَّذِي مَعَكَ؟ هُوَ زَمِيلِي.", uz:"Sen bilan bo'lgan bu kim? U — mening hamkasbim."},
     {ar:"مَا اسْمُهُ؟ اسْمُهُ عُمَرُ.", uz:"Uning ismi nima? Uning ismi — Umar."}
   ],
   vocab:[
     {ar:"أَنَا", tr:"ana", uz:"men"}, {ar:"أَنْتَ", tr:"anta", uz:"sen"},
     {ar:"جَامِعَةٌ", tr:"joomi'atun", uz:"universitet"}, {ar:"زَمِيلٌ", tr:"zamiilun", uz:"hamkasb/sinfdosh"},
     {ar:"مَعَ", tr:"ma'a", uz:"bilan"}, {ar:"الَّذِي", tr:"allazi", uz:"...gan/...adigan"},

/* Wrap each maximal Arabic run (plus the punctuation inside it) in a <bdi>,
   so a label that mixes scripts — "هَذَا, نَعَمْ/لاَ — 24 so'z" — keeps its
   parts in source order. Without an isolate the bidi algorithm pulls the
   trailing digits and Latin to the visual left and the line reads backwards.
   Input must be plain text, not markup. */
const AR_RANGE = '\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF';
const AR_RUN = new RegExp('[' + AR_RANGE + '](?:[' + AR_RANGE + '\\s.,/?!\'"()\u200f-]*[' + AR_RANGE + '])?', 'g');
function bidiIsolate(text){
  return String(text == null ? '' : text).replace(AR_RUN, m => '<bdi>' + m + '</bdi>');
}

/* ---- Shared loading / empty / error states ----
   A bare line of text in an empty viewport gives the reader nothing to do and
   no sense of what failed. Skeletons hold the shape of the list that is
   coming; the error state names the cause and offers the way out. */
function skeletonList(n){
  n = n || 6;
  let rows = '';
  for(let i=0;i<n;i++){
    rows += `<div class="skel-row">
      <div class="skel skel-dot"></div>
      <div class="skel-lines">
        <div class="skel skel-line"></div>
        <div class="skel skel-line short"></div>
      </div>
    </div>`;
  }
  return `<div class="skel-list" role="status" aria-label="Yuklanmoqda">${rows}</div>`;
}
function stateBlock(opts){
  const kind = opts.kind === 'error' ? ' is-error' : '';
  const act = opts.action
    ? `<button class="reveal-btn" onclick="${opts.action.onclick}">${opts.action.label}</button>` : '';
  return `<div class="state${kind}" role="status">
    <span class="state-ic">${icon(opts.icon || 'globe', 24)}</span>
    <span class="state-title">${opts.title}</span>
    ${opts.body ? `<p class="state-body">${opts.body}</p>` : ''}
    ${act}
  </div>`;
}

// Leitner-style boxes: 0=just missed/new, 5=mastered. Interval before a word is due again.
const SRS_INTERVALS_MS = [10*60*1000, 1*86400000, 3*86400000, 7*86400000, 16*86400000, 35*86400000];
let VOCAB_POOL = null;
function buildVocabPool(){
  if(VOCAB_POOL) return VOCAB_POOL;
  const pool = [];
  UNITS.forEach(u=>{
    (u.vocab.core||[]).forEach((v,i)=>{
      pool.push({key: u.id+'_vc_'+i, unitId:u.id, unitTitle:u.title, ar:v[0], uz:v[1]});
    });
  });
  VOCAB_POOL = pool;
  return pool;
}
function getSrsEntry(key){
  if(!PROGRESS.srs) PROGRESS.srs = {};
  if(!PROGRESS.srs[key]) PROGRESS.srs[key] = {box:0, dueAt:Date.now()};
  return PROGRESS.srs[key];
}
function dueVocab(){
  const now = Date.now();
  return buildVocabPool()
    .filter(p => getSrsEntry(p.key).dueAt <= now)
    .sort((a,b) => getSrsEntry(a.key).dueAt - getSrsEntry(b.key).dueAt);
}
function srsStats(){
  const pool = buildVocabPool();
  const boxes = [0,0,0,0,0,0];
  pool.forEach(p => { boxes[getSrsEntry(p.key).box]++; });
  return { total: pool.length, mastered: boxes[5], boxes, due: dueVocab().length };
}
function markSrs(key, gotIt){
  const e = getSrsEntry(key);
  e.box = gotIt ? Math.min(e.box+1, 5) : 0;
  e.dueAt = Date.now() + SRS_INTERVALS_MS[e.box];
  e.lastResult = gotIt;
  saveProgress(PROGRESS);
}

/* ================= MUSHAF (15-line page layout) ================= */
const MUSHAF_API = 'https://api.quran.com/api/v4';
const MUSHAF_TOTAL_PAGES = 604;
let MUSHAF_CACHE = {};

function mushafCacheKey(num){ return 'qa_mushaf_v1_'+num; }
function loadMushafPageFromDisk(num){
  try{ const raw = localStorage.getItem(mushafCacheKey(num)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveMushafPageToDisk(num, data){
  try{ localStorage.setItem(mushafCacheKey(num), JSON.stringify(data)); }catch(e){ /* quota — fine, skip persisting */ }
}

async function fetchMushafPage(num){
  if(MUSHAF_CACHE[num]) return MUSHAF_CACHE[num];
  const disk = loadMushafPageFromDisk(num);
  if(disk){ MUSHAF_CACHE[num] = disk; return disk; }
  const res = await fetch(`${MUSHAF_API}/verses/by_page/${num}?words=true&word_fields=text_uthmani,line_number,page_number&per_page=50`);
  const json = await res.json();
  const lines = {};
  const surahsSeen = [];
  json.verses.forEach(v=>{
    const [surahNum, ayahNum] = v.verse_key.split(':').map(Number);
    if(!surahsSeen.includes(surahNum)) surahsSeen.push(surahNum);
    v.words.forEach(w=>{
      const ln = w.line_number;
      if(!lines[ln]) lines[ln] = [];
      lines[ln].push({text:w.text_uthmani, isEnd: w.char_type_name==='end', surahNum, ayahNum});
    });
  });
  const data = { pageNum:num, lines, surahsOnPage:surahsSeen, juzNumber: json.verses[0] ? json.verses[0].juz_number : null };
  MUSHAF_CACHE[num] = data;
  saveMushafPageToDisk(num, data);
  return data;
}

// Turns the raw per-line word data into an ordered list of rows to render,
// inserting a surah-name header (and Bismillah, except for surah 1 and 9)
// wherever a new surah begins — matching how real Mushaf pages are typeset.
function buildMushafRows(pageData){
  const lineNums = Object.keys(pageData.lines).map(Number).sort((a,b)=>a-b);
  const rows = [];
  let prevSurah = null;
  lineNums.forEach((ln, idx)=>{
    const words = pageData.lines[ln];
    const lineSurah = words[0].surahNum;
    const isNewSurah = (idx===0 && ln>1) || (prevSurah!==null && lineSurah!==prevSurah);
    if(isNewSurah){
      rows.push({type:'header', surahNum:lineSurah});
      if(lineSurah!==1 && lineSurah!==9) rows.push({type:'bismillah'});
    }
    rows.push({type:'text', lineNum:ln, words});
    prevSurah = lineSurah;
  });
  return rows;
}

function renderMushafRow(row){
  if(row.type==='header'){
    const s = (QURAN_LIST||[]).find(x=>x.number===row.surahNum);
    return `<div class="mushaf-surah-header"><span class="mushaf-surah-header-ar">${s?s.name:''}</span></div>`;
  }
  if(row.type==='bismillah'){
    return `<div class="mushaf-bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
  }
  return `<div class="mushaf-line">${row.words.map(w=> w.isEnd ? `<span class="mushaf-ayahend">${w.text}</span>` : w.text).join(' ')}</div>`;
}

// Real Mushaf lines are typeset to exactly fill the page width — no wrapping,
// no scrolling. Since we can't justify Arabic text like that here, each line
// instead gets its font-size shrunk down (never wrapped, never left to
// overflow into a horizontal scrollbar) until it fits the screen width, the
// same way a page of a physical Mushaf always shows the whole line at once.
function fitMushafLines(container){
  if(!container) return;
  const avail = container.clientWidth;
  if(!avail) return;
  container.querySelectorAll('.mushaf-line').forEach(line=>{
    line.style.fontSize = '';
    let guard = 0;
    while(line.scrollWidth > avail && guard < 8){
      const cur = parseFloat(getComputedStyle(line).fontSize);
      const next = Math.max(cur * (avail / line.scrollWidth) * 0.97, 10);
      if(next >= cur) break;
      line.style.fontSize = next + 'px';
      guard++;
    }
  });
}

function trackLastMushafPage(num){
  PROGRESS.lastMushafPage = num;

}

// Swipe left-to-right (finger moves toward the right) opens the NEXT page,
// swipe right-to-left opens the PREVIOUS page — matching Arabic's RTL
// reading direction, where "forward" visually comes from the right.
// If the gesture actually scrolled the page horizontally (a long line that
// overflows on a narrow screen), it's treated as scrolling, not paging.
function attachMushafSwipe(el, pageNum){
  if(!el) return;
  const THRESHOLD = 60;
  let startX = null, startY = null, startScrollLeft = 0;
  el.addEventListener('pointerdown', (e)=>{
    startX = e.clientX; startY = e.clientY; startScrollLeft = el.scrollLeft;
  });
  el.addEventListener('pointerup', (e)=>{
    if(startX === null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const scrolled = el.scrollLeft !== startScrollLeft;
    startX = null;
    if(scrolled) return;
    if(Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
    if(dx > 0){ if(pageNum < MUSHAF_TOTAL_PAGES) go('mushaf',{mushafPageNum:pageNum+1}); }
    else{ if(pageNum > 1) go('mushaf',{mushafPageNum:pageNum-1}); }
  });
}

const BISMILLAH_PREFIX = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ '.normalize('NFC');
function stripBismillah(data){
  // The API bakes the Bismillah into ayah[0].text for every surah except
  // Al-Fatiha (where it IS ayah 1) and At-Tawbah (which has none).
  // Arabic combining diacritics can arrive in different (but visually identical)
  // orders across entries, so both sides are NFC-normalized before comparing.
  if(data.number === 1 || data.number === 9) return data;
  const first = data.ayahs[0];
  if(!first) return data;
  const normalized = first.text.normalize('NFC');
  if(normalized.startsWith(BISMILLAH_PREFIX)){
    data.bismillah = BISMILLAH_PREFIX.trim();
    first.text = normalized.slice(BISMILLAH_PREFIX.length);
  }
  return data;
}

function surahCacheKey(num){ return 'qa_surah_v1_'+num; }
function loadSurahFromDisk(num){
  try{
    const raw = localStorage.getItem(surahCacheKey(num));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSurahToDisk(num, data){
  try{ localStorage.setItem(surahCacheKey(num), JSON.stringify(data)); }catch(e){ /* quota or unavailable — fine, just skip persisting */ }
}
function isSurahAvailableOffline(num){
  return !!QURAN_CACHE[num] || !!loadSurahFromDisk(num);
}
// Disk-only check: what will actually survive an app restart (in-memory
// cache doesn't count, since that's gone the moment the app is closed).
function isSurahPersistedOffline(num){ return !!loadSurahFromDisk(num); }
function offlineSurahCount(){
  let n = 0;
  for(let i=1;i<=114;i++){ if(isSurahPersistedOffline(i)) n++; }
  return n;
}

async function downloadAllQuranOffline(){
  if(STATE.offlineDownloading) return;
  STATE.offlineDownloading = true;
  STATE.offlineTotal = 114;
  STATE.offlineDone = offlineSurahCount();
  render();
  const nums = [];
  for(let i=1;i<=114;i++){ if(!isSurahPersistedOffline(i)) nums.push(i); }
  let idx = 0;
  const CONCURRENCY = 5;
  async function worker(){
    while(idx < nums.length){
      const num = nums[idx++];
      try{ await fetchSurah(num); }catch(e){ /* network hiccup — user can retry, whatever succeeded stays saved */ }
      STATE.offlineDone = offlineSurahCount();
      const bar = document.getElementById('offlineProgressBar');
      const label = document.getElementById('offlineProgressLabel');
      if(bar) bar.style.width = (STATE.offlineDone/STATE.offlineTotal*100)+'%';
      if(label) label.textContent = `${STATE.offlineDone} / ${STATE.offlineTotal}`;
    }
  }
  await Promise.all(Array.from({length:CONCURRENCY}, worker));
  STATE.offlineDownloading = false;
  const finalCount = offlineSurahCount();
  if(finalCount >= 114) showToast("Butun Qur'on (matn va tarjima) offline saqlandi!");
  else showToast(`${finalCount} / 114 sura saqlandi — telefon xotirasi yetarli bo'lmadi.`);
  if(STATE.view==='quran') render();
}

async function fetchSurah(num){
  if(QURAN_CACHE[num]) return QURAN_CACHE[num];
  const disk = loadSurahFromDisk(num);
  if(disk){ QURAN_CACHE[num] = disk; return disk; }
  const [arRes, uzRes] = await Promise.all([
    fetch(`${QURAN_API}/surah/${num}/ar.alafasy`),
    fetch(`${QURAN_API}/surah/${num}/uz.sodik`).catch(()=>null)
  ]);
  const arJson = await arRes.json();
  const data = arJson.data;
  try{
    if(uzRes){
      const uzJson = await uzRes.json();
      data.ayahs.forEach((a,i)=>{ a.uz = uzJson.data.ayahs[i] ? uzJson.data.ayahs[i].text : ''; });
      // Uzbek translation also bakes Bismillah into ayah 1's meaning text
      if(data.number !== 1 && data.number !== 9 && data.ayahs[0] && data.ayahs[0].uz){
        const uzBismillahMatch = data.ayahs[0].uz.match(/^[^.]*?[Бб]исмиллах[^)]*\)\s*/);
        if(uzBismillahMatch) data.ayahs[0].uz = data.ayahs[0].uz.slice(uzBismillahMatch[0].length);
      }
    }
  }catch(e){}
  stripBismillah(data);
  QURAN_CACHE[num] = data;
  saveSurahToDisk(num, data);
  return data;
}

/* ---- Tajweed color-coding (simplified: madd + qalqala, matching Unit 1) ---- */
function isDiacritic(c){
  if(!c) return false;
  const code = c.charCodeAt(0);
  return (code >= 0x064B && code <= 0x0652) || code === 0x0670;
}
function tajweedHighlight(text){
  const qalqalaLetters = 'قطبجد';
  const chars = Array.from(text);
  let out = '';
  for(let i=0;i<chars.length;i++){
    const c = chars[i], next = chars[i+1];
    if(qalqalaLetters.includes(c) && next === 'ْ'){
      out += `<span class="tj-qalqala">${c}${next}</span>`; i++; continue;
    }
    if(c === 'ا' || c === 'ٰ' || c === 'ٓ' || c === 'آ' || c === 'ى'){
      out += `<span class="tj-madd">${c}</span>`; continue;
    }
    if((c === 'و' || c === 'ي') && !isDiacritic(next)){
      out += `<span class="tj-madd">${c}</span>`; continue;
    }
    out += c;
  }
  return out;
}

/* ---- Cross-linking curriculum units <-> full reader ---- */
function unitForSurah(apiNum){
  return UNITS.find(u => u.surahApiNum === apiNum) || null;
}

/* ---- Bookmarks + continue reading ---- */
function isBookmarked(num, idx){ return !!(PROGRESS.bookmarks && PROGRESS.bookmarks[num+'_'+idx]); }
function toggleBookmark(num, idx){
  if(!PROGRESS.bookmarks) PROGRESS.bookmarks = {};
  const key = num+'_'+idx;
  if(PROGRESS.bookmarks[key]) delete PROGRESS.bookmarks[key];
  else PROGRESS.bookmarks[key] = {surahNum:num, ayahIdx:idx, ts:Date.now()};
  saveProgress(PROGRESS);
  render();
}
function trackLastRead(num){
  PROGRESS.lastRead = {surahNum:num, ts:Date.now()};
  saveProgress(PROGRESS);
  recordActivity();
}

function startRangedPlayback(){
  const n = QURAN_CACHE[STATE.surahNum].numberOfAyahs;
  let from = Math.max(1, Math.min(n, parseInt(document.getElementById('qFrom').value)||1));
  let to = Math.max(1, Math.min(n, parseInt(document.getElementById('qTo').value)||n));
  if(from > to){ const t=from; from=to; to=t; }
  const repeat = Math.max(1, Math.min(20, parseInt(document.getElementById('qRepeat').value)||1));
  QPLAYER.surahNum = STATE.surahNum;
  QPLAYER.rangeStart = from - 1;
  QPLAYER.rangeEnd = to - 1;
  QPLAYER.repeatCount = repeat;
  QPLAYER.repeatDone = 0;
  QPLAYER.idx = QPLAYER.rangeStart;
  QPLAYER.singleMode = false;
  QPLAYER.playing = true;
  closeInstallSheet();
  playCurrentAyah();
  renderQuranPlayer();

  QPLAYER.surahNum = num; QPLAYER.idx = idx; QPLAYER.playing = true; QPLAYER.singleMode = true;

function playCurrentAyah(){
  const ayahs = QURAN_CACHE[QPLAYER.surahNum].ayahs;
  if(QPLAYER.idx >= ayahs.length){ QPLAYER.playing=false; renderQuranPlayer(); return; }
  const a = ensureAudioEl();
  a.src = ayahs[QPLAYER.idx].audio;
  a.play().catch(()=>{});
  highlightAyah(QPLAYER.idx);
  updateMediaMetadata();
  renderQuranPlayer();
}

function toggleContinuous(){
  const num = STATE.surahNum;
  const isThisPlaying = QPLAYER.playing && QPLAYER.surahNum===num && !QPLAYER.singleMode;
  if(isThisPlaying){
    ensureAudioEl().pause(); QPLAYER.playing = false;
  } else {
    // Only reset to a plain full-surah session when this isn't a resume of an
    // already-configured (possibly ranged) session for the same surah.
    if(QPLAYER.surahNum !== num){
      QPLAYER.idx = 0;
      QPLAYER.rangeStart = null; QPLAYER.rangeEnd = null;
      QPLAYER.repeatCount = 1; QPLAYER.repeatDone = 0;
    }
    QPLAYER.surahNum = num; QPLAYER.singleMode = false; QPLAYER.playing = true;
    playCurrentAyah();
  }
  renderQuranPlayer();
}

function quranNext(){
  if(QPLAYER.singleMode){ QPLAYER.playing = false; renderQuranPlayer(); return; }
  const ayahs = QURAN_CACHE[QPLAYER.surahNum] ? QURAN_CACHE[QPLAYER.surahNum].ayahs : [];
  const rangeStart = (QPLAYER.rangeStart != null) ? QPLAYER.rangeStart : 0;
  const rangeEnd = (QPLAYER.rangeEnd != null) ? QPLAYER.rangeEnd : ayahs.length - 1;
  QPLAYER.idx++;
  if(QPLAYER.idx > rangeEnd){
    QPLAYER.repeatDone = (QPLAYER.repeatDone||0) + 1;
    const totalRepeats = QPLAYER.repeatCount || 1;
    if(QPLAYER.repeatDone < totalRepeats){
      QPLAYER.idx = rangeStart; // loop back for another repeat pass
    } else {
      QPLAYER.playing = false; QPLAYER.idx = 0;
      QPLAYER.rangeStart = null; QPLAYER.rangeEnd = null;
      QPLAYER.repeatCount = 1; QPLAYER.repeatDone = 0;
      renderQuranPlayer();
      return;
    }
  }
  playCurrentAyah();
}

function highlightAyah(idx){
  document.querySelectorAll('.qayah').forEach(el=>el.classList.remove('qayah-active'));
  const el = document.getElementById('qayah-'+idx);
  if(el){ el.classList.add('qayah-active'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
}

function renderQuranPlayer(){
  let bar = document.getElementById('qplayerbar');
  // Global mini-player: visible on ANY page as long as a playback session exists
  // (loaded and playing, or paused mid-session) — not tied to being on the Qur'on page.
  const hasSession = !!QPLAYER.surahNum && !QPLAYER.singleMode && QPLAYER.audioEl && QPLAYER.audioEl.src;
  if(!hasSession){
    if(bar) bar.remove();
    document.getElementById('main').style.paddingBottom = '';
    return;
  }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'qplayerbar';
    bar.className = 'qplayer-bar';
    document.getElementById('app').appendChild(bar);
  }
  bar.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + 14px)';
  const playing = QPLAYER.playing;
  const cached = QURAN_CACHE[QPLAYER.surahNum];
  const isRanged = QPLAYER.rangeStart != null;
  let label = cached ? cached.englishName : "Qur'on";
  label += playing ? ` &middot; Oyat ${QPLAYER.idx+1} / ${cached?cached.numberOfAyahs:'?'}` : ' &middot; to\'xtatilgan';
  if(playing && isRanged){
    const totalRepeats = QPLAYER.repeatCount || 1;
    label = `${cached?cached.englishName:''} &middot; ${QPLAYER.idx+1} (${QPLAYER.rangeStart+1}–${QPLAYER.rangeEnd+1}) &middot; ${(QPLAYER.repeatDone||0)+1}/${totalRepeats}`;
  }
  bar.innerHTML = `
    <button class="qplayer-toggle" onclick="toggleContinuous()">${playing?'&#10074;&#10074;':'&#9658;'}</button>
    <span class="qplayer-label" style="cursor:pointer;" onclick="go('quranSurah',{surahNum:${QPLAYER.surahNum}})">${label}</span>
    ${isRanged ? `<button class="qplayer-toggle" style="font-size:.7rem;width:auto;padding:0 10px;border-radius:14px;" onclick="stopRangedPlayback()">To'xtatish</button>` : ''}
    <button class="qplayer-toggle" onclick="dismissPlayer()" aria-label="Yopish">&#10005;</button>
  `;
  // ensure page content never sits behind the fixed bar
  requestAnimationFrame(()=>{
    const barH = bar.offsetHeight || 56;
    document.getElementById('main').style.paddingBottom = (barH + 32) + 'px';
  });
}

function dismissPlayer(){
  if(QPLAYER.audioEl){ QPLAYER.audioEl.pause(); }
  QPLAYER.playing = false; QPLAYER.surahNum = null;
  QPLAYER.rangeStart = null; QPLAYER.rangeEnd = null;
  QPLAYER.repeatCount = 1; QPLAYER.repeatDone = 0;
  renderQuranPlayer();
}

/* ================= HIFZ (MEMORIZATION) ================= */
function hifzKey(num, idx){ return num+'_'+idx; }
function getHifzEntry(num, idx){
  if(!PROGRESS.hifz) PROGRESS.hifz = {};
  const k = hifzKey(num, idx);
  if(!PROGRESS.hifz[k]) PROGRESS.hifz[k] = {reps:0, writeReps:0, status:'new', lastPracticed:null};
  return PROGRESS.hifz[k];
}
function hifzStats(){
  const entries = Object.entries(PROGRESS.hifz||{});
  const bySurah = {};
  entries.forEach(([k,e])=>{
    const num = k.split('_')[0];
    if(!bySurah[num]) bySurah[num] = {total:0, memorized:0};
    bySurah[num].total++;
    if(e.status==='memorized') bySurah[num].memorized++;
  });
  return {
    total: entries.length,
    memorized: entries.filter(([,e])=>e.status==='memorized').length,
    learning: entries.filter(([,e])=>e.status==='learning').length,
    bySurah
  };
}
function stripArabicDiacritics(s){
  return (s||'').replace(/[\u064B-\u0652\u0670\u0640\u0671]/g,'ا').replace(/[\u0622\u0623\u0625]/g,'ا').replace(/\s+/g,' ').trim();
}
function similarityPct(a,b){
  a = stripArabicDiacritics(a); b = stripArabicDiacritics(b);
  if(!a.length) return 0;
  const bChars = b.split('');
  let matches = 0;
  for(const ch of a.split('')){ const idx = bChars.indexOf(ch); if(idx>-1){ matches++; bChars.splice(idx,1); } }
  return Math.round((matches/a.length)*100);
}

      <div class="txt"><b>${stats.memorized} oyat yodlangan</b>${stats.learning} tasi jarayonda</div>

/* Plain, printable handwriting-practice sheet — one full page per ayah in
   the current hifz range, with a toggle to show/hide the Arabic text (for
   copying vs. blind recall) and ruled blank lines to write on. */
function renderHifzWriteSheet(cached, num){
  if(STATE.hifzSheetShowText === undefined) STATE.hifzSheetShowText = true;
  if(!STATE.hifzSheetText) STATE.hifzSheetText = {};
  const showText = STATE.hifzSheetShowText;
  let html = `<div class="wp-toolbar no-print">
    <button class="action-btn" onclick="STATE.hifzSheetShowText=${!showText}; render();">${showText ? icon('eye-off',14)+' Matnni berkitish' : icon('eye',14)+" Matnni ko'rsatish"}</button>
    <button class="action-btn" onclick="STATE.hifzSheetText={}; render();">${icon('trash',14)} Tozalash</button>
    <button class="action-btn primary" onclick="window.print()">${icon('printer',14)} Chop etish</button>
  </div>
  <div class="write-sheet">`;
  for(let idx=STATE.hifzFrom; idx<=STATE.hifzTo; idx++){
    const a = cached.ayahs[idx];
    if(!a) continue;

function toggleWordHide(i){
  if(!STATE.hifzHidden) STATE.hifzHidden = [];

  if(pos>-1) STATE.hifzHidden.splice(pos,1); else STATE.hifzHidden.push(i);

function hideAllWords(count){

function checkHifzWrite(num, idx){
  const cached = QURAN_CACHE[num];
  const written = document.getElementById('hzWriteInput').value;
  const pct = similarityPct(cached.ayahs[idx].text, written);
  const entry = getHifzEntry(num, idx);

  const fb = document.getElementById('hzWriteFeedback');

  if(pct >= 85){ msg = `&#10003; Ajoyib! ${pct}% mos keldi.`; color='var(--jade)'; }

  else { msg = `${pct}% mos keldi. Oyatga qayta qarab, yana yozing.`; color='var(--rubric)'; }
  fb.innerHTML = `<span style="color:${color}; font-weight:700;">${msg}</span>`;
  document.getElementById('hzWriteInput').value = '';
  setTimeout(()=>{ const btn=document.querySelector('.reveal-btn'); if(btn) btn.textContent = `Tekshirish (${entry.writeReps} marta yozildi)`; }, 10);
}
function markHifzStatus(num, idx, status){
  const entry = getHifzEntry(num, idx);

function hifzNav(dir){

}

/* ================= DAILY REMINDER NOTIFICATIONS (native only) ================= */
function notifPlugin(){
  return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null;
}
async function toggleDailyReminder(on){
  const plugin = notifPlugin();
  if(!plugin){ showToast("Bildirishnoma faqat ilova (APK) versiyasida ishlaydi."); return; }
  if(on){
    const perm = await plugin.requestPermissions();
    if(perm.display !== 'granted'){ showToast("Ruxsat berilmadi."); return; }
    const hour = parseInt((document.getElementById('reminderTime')||{}).value?.split(':')[0]) || 18;
    const minute = parseInt((document.getElementById('reminderTime')||{}).value?.split(':')[1]) || 0;
    await plugin.schedule({ notifications: [{
      id: 1001,
      title: "Arabix — vaqti keldi",
      body: "Bugungi darsni yoki takrorlashni oching. Ketma-ketlikni uzmang!",
      schedule: { on: { hour, minute }, repeats: true, allowWhileIdle: true },
    }]});
    PROGRESS.reminderOn = true; PROGRESS.reminderTime = `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
  } else {
    await plugin.cancel({ notifications: [{ id: 1001 }] });
    PROGRESS.reminderOn = false;
  }
  saveProgress(PROGRESS);
  render();
}

/* ================= STREAKS & DAILY GOAL ================= */
function todayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function recordActivity(){
  if(!PROGRESS.activityDates) PROGRESS.activityDates = {};
  const key = todayKey();
  if(!PROGRESS.activityDates[key]){
    PROGRESS.activityDates[key] = true;
    saveProgress(PROGRESS);
  }
}
function currentStreak(){
  if(!PROGRESS.activityDates) return 0;
  let streak = 0;
  let d = new Date();
  const todayDone = !!PROGRESS.activityDates[todayKey()];
  if(!todayDone) d.setDate(d.getDate()-1); // streak still "alive" until today ends
  while(PROGRESS.activityDates[todayKey(d)]){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function bestStreak(){
  if(!PROGRESS.activityDates) return 0;
  const dates = Object.keys(PROGRESS.activityDates).sort();
  let best=0, cur=0, prevTime=null;
  for(const key of dates){
    const t = new Date(key+'T00:00:00').getTime();
    cur = (prevTime!=null && Math.round((t-prevTime)/86400000)===1) ? cur+1 : 1;
    best = Math.max(best, cur);
    prevTime = t;
  }
  return best;
}
function todayDone(){ return !!(PROGRESS.activityDates && PROGRESS.activityDates[todayKey()]); }

function pctDone(){

}
function isDone(id){ return !!PROGRESS.done[id]; }
function markDone(id, val){ PROGRESS.done[id] = val; saveProgress(PROGRESS); }
function exKey(unitId, idx){ return unitId+'_'+idx; }
function setExResult(unitId, idx, correct){
  PROGRESS.exercises[exKey(unitId,idx)] = correct;
  saveProgress(PROGRESS);

function go(view, opts){
  const prevView = STATE.view;
  STATE.view = view;
  if(opts && opts.unitId !== undefined) STATE.unitId = opts.unitId;
  if(opts && opts.refSection !== undefined) STATE.refSection = opts.refSection;
  if(opts && opts.surahNum !== undefined) STATE.surahNum = opts.surahNum;
  if(opts && opts.mushafPageNum !== undefined) STATE.mushafPageNum = opts.mushafPageNum;
  if(opts && opts.alifboLevelId !== undefined){
    const enteringFresh = prevView !== 'alifboLevel' || opts.alifboLevelId !== STATE.alifboLevelId;
    STATE.alifboLevelId = opts.alifboLevelId;
    if(enteringFresh){ STATE.alifboPhase = 'cards'; STATE.alifboCardIdx = 0; }
  }
  if(opts && opts.grammarUnitId !== undefined) STATE.grammarUnitId = opts.grammarUnitId;
  if(opts && opts.madinaUnitId !== undefined) STATE.madinaUnitId = opts.madinaUnitId;
  window.scrollTo(0,0);
  VIEW_CHANGED = (prevView !== view);
  render();
  VIEW_CHANGED = false;
}

/* Single source of truth for "go up one level" — used by the in-app back
   button AND the native hardware/gesture back button (see the Capacitor
   backButton listener below), so both behave the same way instead of the
   hardware button falling through to a full reload. Returns false when
   already at the root (home), so the caller can decide to exit the app. */
function goBack(){
  if(STATE.view === 'review' && REVIEW_SESSION){ REVIEW_SESSION = null; go('review'); return true; }
  if(STATE.view === 'quranSurah'){ go('quran'); return true; }
  if(STATE.view === 'hifzSession'){ go('hifz'); return true; }
  if(STATE.view === 'alifboLevel'){ go('alifbo'); return true; }
  if(STATE.view === 'madinaGame'){ STATE.madinaGameData = null; go('madina'); return true; }
  if(STATE.view === 'madinaUnit'){ go('madina'); return true; }
  if(STATE.view === 'grammarUnit'){ go('grammatika'); return true; }
  if(STATE.view === 'quranSurah'){ go('quran'); return true; }
  if(STATE.view === 'home'){ return false; }
  go('home');
  return true;
}

/* Activity calendar. The app stores one boolean per day, so this is a
   two-state grid — no invented intensity. Each cell carries its own date in
   the title/aria-label and the total is stated in the caption, so nothing is
   readable only on hover. */
function renderActivityCalendar(){
  const WEEKS = 18, CELL = 18, GAP = 3, days = [];
  const today = new Date(); today.setHours(0,0,0,0);
  // Fill back to the Monday that starts the first shown week.
  const end = new Date(today);
  const offsetToSunday = 6 - ((today.getDay() + 6) % 7); // days remaining in this week
  end.setDate(end.getDate() + offsetToSunday);
  const total = WEEKS * 7;
  let active = 0;
  for(let i = total - 1; i >= 0; i--){
    const d = new Date(end); d.setDate(end.getDate() - i);
    const key = todayKey(d);
    const on = !!(PROGRESS.activityDates && PROGRESS.activityDates[key]);
    const future = d > today;
    if(on) active++;
    days.push({key, on, future, d});
  }
  const cells = days.map(x=>{
    const cls = x.future ? 'future' : (x.on ? 'on' : '');
    const state = x.future ? '' : (x.on ? " — faol" : " — faollik yo'q");
    return `<div class="cal-cell ${cls}" role="img" aria-label="${x.key}${state}" title="${x.key}${state}"></div>`;
  }).join('');
  return `<div class="viz-card">
    <div class="viz-title">Faollik</div>
    <div class="viz-sub">Oxirgi ${WEEKS} hafta &middot; ${active} kun faol</div>
    <div class="cal-grid" style="max-width:${WEEKS*CELL + (WEEKS-1)*GAP}px;">${cells}</div>
    <div class="cal-legend">
      <span class="cal-key off"></span><span>Faollik yo'q</span>
      <span class="cal-key on" style="margin-left:8px;"></span><span>Faol kun</span>
    </div>
  </div>`;
}

/* One meter per phase: a single ratio against a limit. */
function renderPhaseMeters(){
  const rows = Object.keys(PHASES).map(k=>{
    const phase = Number(k);
    const units = UNITS.filter(u=>u.phase===phase);
    const done = units.filter(u=>isDone(u.id)).length;
    const pct = units.length ? Math.round(done/units.length*100) : 0;
    return `<div class="meter-row">
      <div class="meter-head">
        <span class="meter-name">${PHASES[phase].label} &middot; ${PHASES[phase].name}</span>
        <span class="meter-value">${done}/${units.length}</span>
      </div>
      <div class="meter-track" role="img" aria-label="${PHASES[phase].label}: ${done} / ${units.length} dars">
        <div class="meter-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="viz-card">
    <div class="viz-title">Bosqichlar</div>
    <div class="viz-sub">Har bosqichda tugallangan darslar</div>
    ${rows}
  </div>`;
}

/* Six ordered mastery buckets. Ordered categories take the ordinal ramp, so
   the colour carries the order as well as the height. Values sit on the caps,
   so no number is reachable only through a tooltip. */
function renderSrsChart(srs){
  // Box numbers on the axis with the endpoints explained in the caption: a
  // full word like "Mustahkam" cannot fit a sixth of the width without being
  // clipped or broken mid-word, and a clipped category label is worse than none.
  const LABELS = ['0','1','2','3','4','5'];
  const RAMP = ['--v1','--v2','--v3','--v4','--v5','--v6'];
  const max = Math.max(1, ...srs.boxes);
  const bars = srs.boxes.map((n,i)=>{
    const h = Math.round((n/max)*88);
    return `<div class="col-slot">
      <span class="col-value">${n}</span>
      <div class="col-bar" style="height:${h}px; background:var(${RAMP[i]});"
           role="img" aria-label="${i===0?'Yangi':i===5?'Mustahkam':i+'-quti'}: ${n} so'z"></div>
    </div>`;
  }).join('');
  return `<div class="viz-card">
    <div class="viz-title">So'z qutilari</div>
    <div class="viz-sub">${srs.total} so'z &middot; 0 = yangi, 5 = mustahkam &middot; o'ngga siljigan so'z uzoqroq vaqtdan keyin qaytadi</div>
    <div class="col-chart">${bars}</div>
    <div class="col-axis">${LABELS.map(l=>`<span>${l}</span>`).join('')}</div>
  </div>`;
}

function arNum(n){
  const digits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(n).split('').map(d=>digits[+d]).join('');
}

function vocabCard(v, tag, key){
  return `<div class="vocab-card ${tag}" onclick="this.classList.toggle('flipped')">
    <span class="tag">${tag==='core'?'YODLASH':'TANISH'}</span>
    <div class="ar">${v[0]}</div>
    <div class="uz">${v[1]}</div>
  </div>`;
}

/* ================= EXERCISES ================= */
function buildExercise(ex, unitId, idx){
  const wrap = document.createElement('div');
  wrap.className = 'ex-card';
  if(ex.type === 'mcq') return buildMCQ(ex, unitId, idx, wrap);
  if(ex.type === 'reveal') return buildReveal(ex, unitId, idx, wrap);
  if(ex.type === 'match') return buildMatch(ex, unitId, idx, wrap);
  return wrap;
}

function buildMCQ(ex, unitId, idx, wrap){
  wrap.innerHTML = `<div class="ex-kicker">${ex.kicker}</div><div class="ex-q">${ex.q}</div><div class="ex-options"></div><div class="ex-feedback-slot"></div>`;
  const optWrap = wrap.querySelector('.ex-options');
  let answered = false;
  ex.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'ex-opt';
    b.innerHTML = /[؀-ۿ]/.test(opt) ? `<span class="ar">${opt}</span>` : opt;
    b.onclick = ()=>{
      if(answered) return;
      answered = true;
      const correct = i === ex.correct;
      b.classList.add(correct ? 'correct' : 'wrong');
      optWrap.querySelectorAll('.ex-opt').forEach(o=>o.classList.add('disabled'));
      if(!correct) optWrap.children[ex.correct].classList.add('correct');
      const fb = wrap.querySelector('.ex-feedback-slot');
      fb.innerHTML = `<div class="ex-feedback ${correct?'ok':'no'}">${correct?'&#10003; To\'g\'ri! ':'&#10007; '}${ex.explain||''}</div>`;
      setExResult(unitId, idx, correct);
    };
    optWrap.appendChild(b);
  });
  return wrap;
}

function buildReveal(ex, unitId, idx, wrap){
  wrap.innerHTML = `<div class="ex-kicker">${ex.kicker}</div><div class="ex-q">${ex.prompt}</div>
    <button class="reveal-btn">Javobni ko'rsatish</button>
    <div class="reveal-slot"></div>`;
  const btn = wrap.querySelector('.reveal-btn');
  btn.onclick = ()=>{
    wrap.querySelector('.reveal-slot').innerHTML = `
      <div class="reveal-answer">${ex.answer}</div>
      <div class="self-check">
        <button class="got">To'g'ri topdim</button>
        <button class="miss">Adashdim</button>
      </div>`;
    btn.remove();
    wrap.querySelector('.got').onclick = (e)=>{
      wrap.querySelectorAll('.self-check button').forEach(x=>x.classList.remove('picked'));
      e.target.classList.add('picked');
      setExResult(unitId, idx, true);
    };
    wrap.querySelector('.miss').onclick = (e)=>{
      wrap.querySelectorAll('.self-check button').forEach(x=>x.classList.remove('picked'));
      e.target.classList.add('picked');
      setExResult(unitId, idx, false);
    };
  };
  return wrap;
}

function buildMatch(ex, unitId, idx, wrap){
  const pairs = ex.pairs;
  const rightShuffled = pairs.map((p,i)=>({txt:p.r, i})).sort(()=>Math.random()-0.5);
  wrap.innerHTML = `<div class="ex-kicker">MASHQ &middot; Moslang</div>
    <div class="match-row">
      <div class="match-col" id="mcol-l"></div>
      <div class="match-col" id="mcol-r"></div>
    </div>
    <div class="ex-feedback-slot"></div>`;
  const lcol = wrap.querySelector('#mcol-l');
  const rcol = wrap.querySelector('#mcol-r');
  let selL = null, matchedCount = 0;
  pairs.forEach((p,i)=>{
    const item = document.createElement('div');
    item.className = 'match-item';
    item.innerHTML = `<span class="ar">${p.l}</span>`;
    item.dataset.i = i;
    item.onclick = ()=>{
      if(item.classList.contains('matched')) return;
      lcol.querySelectorAll('.match-item').forEach(x=>x.classList.remove('sel'));
      item.classList.add('sel');
      selL = i;
    };
    lcol.appendChild(item);
  });
  rightShuffled.forEach(rp=>{
    const item = document.createElement('div');
    item.className = 'match-item';
    item.textContent = rp.txt;
    item.dataset.i = rp.i;
    item.onclick = ()=>{
      if(item.classList.contains('matched') || selL === null) return;
      if(selL === rp.i){
        item.classList.add('matched');
        lcol.querySelector(`.match-item[data-i="${selL}"]`).classList.add('matched');
        matchedCount++;
        if(matchedCount === pairs.length){
          wrap.querySelector('.ex-feedback-slot').innerHTML = `<div class="ex-feedback ok">&#10003; Barchasi to'g'ri moslashtirildi!</div>`;
          setExResult(unitId, idx, true);
        }
      } else {
        item.classList.add('shake');
        const lEl = lcol.querySelector(`.match-item[data-i="${selL}"]`);
        lEl.classList.add('shake');
        setTimeout(()=>{ item.classList.remove('shake'); lEl.classList.remove('shake'); lEl.classList.remove('sel'); }, 350);
      }
      selL = null;
    };
    rcol.appendChild(item);
  });
  return wrap;
}

/* ================= APP ICON (canvas-generated, for Add to Home Screen) ================= */
/* Trefoil mark: three teal-to-gold gradient petals rotated 120deg around a
   shared point, with a dark ink core — matches the desktop/Android icon set. */
function generateAppIcon(size){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const r = size*0.22;
  ctx.fillStyle = '#0b1e22';
  roundRect(ctx, 0, 0, size, size, r); ctx.fill();

  const margin = size*0.08;
  const s = (size - margin*2)/100;
  const ox = margin, oy = margin;
  const toX = x => ox + x*s, toY = y => oy + y*s;

  const grad = ctx.createLinearGradient(toX(10), toY(0), toX(90), toY(100));
  grad.addColorStop(0, '#4FE0C2');
  grad.addColorStop(0.55, '#2FA98F');
  grad.addColorStop(1, '#E7B255');

  const petals = [[0,1], [120,0.92], [240,0.86]];
  petals.forEach(([angle, opacity])=>{
    ctx.save();
    ctx.translate(toX(50), toY(52));
    ctx.rotate(angle*Math.PI/180);
    ctx.translate(-toX(50), -toY(52));
    ctx.beginPath();
    ctx.moveTo(toX(50), toY(52));
    ctx.quadraticCurveTo(toX(31), toY(30), toX(50), toY(4));
    ctx.quadraticCurveTo(toX(69), toY(30), toX(50), toY(52));
    ctx.closePath();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  });

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0B1E22';
  ctx.beginPath();
  ctx.arc(toX(50), toY(52), 6.5*s, 0, Math.PI*2);
  ctx.fill();

  return c.toDataURL('image/png');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function setupIconLinks(){
  const draw = ()=>{
    const icon192 = generateAppIcon(192);
    const icon180 = generateAppIcon(180);
    let apple = document.querySelector('link[rel="apple-touch-icon"]');
    if(!apple){ apple = document.createElement('link'); apple.rel='apple-touch-icon'; document.head.appendChild(apple); }
    apple.href = icon180;
    let fav = document.querySelector('link[rel="icon"]');
    if(!fav){ fav = document.createElement('link'); fav.rel='icon'; document.head.appendChild(fav); }
    fav.href = icon192;
    const manifest = {
      name: "Arabix — Qur'oniy Arabcha", short_name: "Arabix",
      start_url: ".", display: "standalone", background_color: "#ffffff", theme_color: "#b3123a",
      icons: [{src: icon192, sizes:"192x192", type:"image/png"}]
    };
    let man = document.querySelector('link[rel="manifest"]');
    if(!man){ man = document.createElement('link'); man.rel='manifest'; document.head.appendChild(man); }
    man.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    let meta = document.querySelector('meta[name="apple-mobile-web-app-capable"]');
    if(!meta){ meta = document.createElement('meta'); meta.name='apple-mobile-web-app-capable'; meta.content='yes'; document.head.appendChild(meta); }
    let tc = document.querySelector('meta[name="theme-color"]');
    if(!tc){ tc = document.createElement('meta'); tc.name='theme-color'; tc.content='#b3123a'; document.head.appendChild(tc); }
  };
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw).catch(draw); }
  else draw();
}

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;

}

async function downloadApp(){
  if(!window.claude || !window.claude.downloads){
    showToast("Yuklab olish bu ko'rinishda mavjud emas — \"Bosh ekranga qo'shish\"dan foydalaning.");
    return;
  }
  try{
    const html = '<!doctype html>\n' + document.documentElement.outerHTML;
    await window.claude.downloads.save({ filename: "quroniy-arabcha-1-kitob.html", data: html });
    showToast("Saqlandi! Endi uni istalgan brauzerda ochishingiz mumkin.");
    closeInstallSheet();
  }catch(err){
    const code = err && err.code;
    let msg = "Yuklab olishda xatolik yuz berdi.";
    if(code === 'declined') msg = "Yuklab olish bekor qilindi.";
    else if(code === 'extension_not_enabled' || code === 'rejected_extension') msg = "Bu ko'rinishda fayl yuklab olish yoqilmagan — \"Bosh ekranga qo'shish\"dan foydalaning.";
    else if(code === 'rate_limited') msg = "Biroz kuting, so'ng qayta urinib ko'ring.";
    else if(code === 'too_large') msg = "Fayl hajmi juda katta.";
    showToast(msg);
  }
}

/* ---- Game 2: MCQ Quiz ---- */
function madinaBuildQuiz(pool){
  const shuffled = pool.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(15, pool.length));
  const qs = shuffled.map(it=>{
    let distractors = pool.filter(x=>x.uz!==it.uz).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.uz);
    const options = [it.uz, ...distractors].sort(()=>Math.random()-0.5);
    return {ar:it.ar, tr:it.tr, answer:it.uz, options, correctIndex:options.indexOf(it.uz)};
  });
  return {qs, idx:0, score:0};
}
function renderMadinaQuiz(m, pool){
  if(!STATE.madinaGameData) STATE.madinaGameData = madinaBuildQuiz(pool);
  const gd = STATE.madinaGameData;
  if(gd.idx >= gd.qs.length){
    m.innerHTML = `<div class="folio" style="text-align:center;">
      ${madinaGameHeader('Test')}
      <div class="milestone"><div class="star">${icon('target',36)}</div><h3>Tugadi!</h3>

      <button class="primary" onclick="go('madina')">Tayyor</button></div></div>`;

  }
  const q = gd.qs[gd.idx];
  let html = `<div class="folio">
    ${madinaGameHeader(`Test &middot; ${gd.idx+1}/${gd.qs.length}`)}
    <div class="alifbo-flashcard"><div class="alifbo-big-ar" style="font-size:2.6rem;">${q.ar}</div><div class="alifbo-answer">${q.tr}</div></div>

    </div>
    <div class="ex-feedback-slot" id="mqFeedback"></div>
  </div>`;
  m.innerHTML = html;
}
function answerMadinaQuiz(i){
  const gd = STATE.madinaGameData;
  const q = gd.qs[gd.idx];
  const opts = document.querySelectorAll('#mqOpts .ex-opt');
  if(opts[0] && opts[0].classList.contains('disabled')) return;
  const correct = i === q.correctIndex;
  if(correct) gd.score++;
  opts.forEach((o,idx)=>{ o.classList.add('disabled'); if(idx===q.correctIndex) o.classList.add('correct'); else if(idx===i) o.classList.add('wrong'); });
  document.getElementById('mqFeedback').innerHTML = `<div class="ex-feedback ${correct?'ok':'no'}">${correct?"&#10003; To'g'ri!":"&#10007; To'g'ri javob: "+q.answer}</div>`;
  setTimeout(()=>{ gd.idx++; render(); }, 1000);
}

/* ---- Game 3: Memory match (concentration) ---- */
function madinaBuildMatch(pool){
  const n = Math.min(8, pool.length);
  const chosen = pool.slice().sort(()=>Math.random()-0.5).slice(0, n);
  let cells = [];
  chosen.forEach((it,i)=>{
    cells.push({key:i, side:'ar', text:it.ar});
    cells.push({key:i, side:'uz', text:it.uz});
  });
  cells = cells.sort(()=>Math.random()-0.5).map((c,i)=>({...c, id:i, matched:false}));
  return {cells, openIds:[], matchedCount:0, total:n, moves:0};
}
function renderMadinaMatch(m, pool){
  if(!STATE.madinaGameData) STATE.madinaGameData = madinaBuildMatch(pool);
  const gd = STATE.madinaGameData;
  if(gd.matchedCount === gd.total){
    m.innerHTML = `<div class="folio" style="text-align:center;">
      ${madinaGameHeader('Juftlik topish')}
      <div class="milestone"><div class="star">${icon('grid-2',36)}</div><h3>Barchasi topildi!</h3>
      <p>${gd.moves} marta urindingiz.</p></div>
      <div class="unit-nav"><button onclick="startMadinaGame('match')">${icon('repeat',14)} Qayta boshlash</button>
      <button class="primary" onclick="go('madina')">Tayyor</button></div></div>`;
    return;
  }
  let html = `<div class="folio">
    ${madinaGameHeader('Juftlik topish')}
    <div class="viz-sub">Arabcha so'z va ma'nosini toping &middot; ${gd.moves} urinish</div>
    <div class="memory-grid">
      ${gd.cells.map(c=>{
        const open = gd.openIds.includes(c.id) || c.matched;
        return `<button class="memory-cell ${open?'open':''} ${c.matched?'matched':''} ${c.side==='ar'?'ar':''}" onclick="flipMadinaMemory(${c.id})">${open?c.text:'?'}</button>`;
      }).join('')}
    </div>
  </div>`;
  m.innerHTML = html;
}
function flipMadinaMemory(id){
  const gd = STATE.madinaGameData;
  if(gd.openIds.length>=2) return;
  const cell = gd.cells.find(c=>c.id===id);
  if(!cell || cell.matched || gd.openIds.includes(id)) return;
  gd.openIds.push(id);
  render();
  if(gd.openIds.length===2){
    gd.moves++;
    const [a,b] = gd.openIds.map(x=>gd.cells.find(c=>c.id===x));
    if(a.key===b.key && a.side!==b.side){
      a.matched = true; b.matched = true;
      gd.matchedCount++;
      gd.openIds = [];
      recordActivity();
      render();
    } else {
      setTimeout(()=>{ gd.openIds = []; render(); }, 700);
    }
  }
}

/* ---- Game 4: Letter/word scramble ---- */
function madinaBuildScramble(pool){
  const items = pool.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(10, pool.length));
  return {items, idx:0, score:0, picked:[], pieces:null};
}
/* Group each base letter with the harakat that sit on it, so a tile is always
   a readable letter rather than a floating diacritic. */
const AR_COMBINING = /[\u064B-\u0655\u0670\u06D6-\u06ED\u0656-\u065F]/;
function arabicClusters(word){
  const out = [];
  for(const ch of word.replace(/\s+/g,'')){
    if(out.length && AR_COMBINING.test(ch)) out[out.length-1] += ch;
    else out.push(ch);
  }
  return out;
}
function madinaScramblePieces(word){
  const letters = arabicClusters(word);
  const arr = letters.map((ch,i)=>({ch, id:i}));
  let shuffled = arr.slice().sort(()=>Math.random()-0.5);
  if(shuffled.map(x=>x.ch).join('') === arr.map(x=>x.ch).join('') && shuffled.length>1){
    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
  }
  return {target: arr, shuffled};
}
function renderMadinaScramble(m, pool){
  if(!STATE.madinaGameData) STATE.madinaGameData = madinaBuildScramble(pool);
  const gd = STATE.madinaGameData;
  if(gd.idx >= gd.items.length){
    m.innerHTML = `<div class="folio" style="text-align:center;">
      ${madinaGameHeader('Harflarni tuzish')}
      <div class="milestone"><div class="star">${icon('puzzle',36)}</div><h3>Tugadi!</h3>
      <p>${gd.score} / ${gd.items.length} to'g'ri.</p></div>
      <div class="unit-nav"><button onclick="startMadinaGame('scramble')">${icon('repeat',14)} Qayta boshlash</button>
      <button class="primary" onclick="go('madina')">Tayyor</button></div></div>`;
    return;
  }
  if(!gd.pieces) gd.pieces = madinaScramblePieces(gd.items[gd.idx].ar);
  const item = gd.items[gd.idx];
  const usedIds = gd.picked.map(p=>p.id);
  let html = `<div class="folio">
    ${madinaGameHeader(`Harflarni tuzish &middot; ${gd.idx+1}/${gd.items.length}`)}
    <p class="prose" style="text-align:center;font-weight:700;font-size:1.1rem;">${item.uz}</p>
    <div class="scramble-answer" dir="rtl">
      ${gd.picked.length ? gd.picked.map(p=>`<span class="scramble-tile placed">${p.ch}</span>`).join('') : `<span class="scramble-placeholder">harflarni pastdan bosing</span>`}
    </div>
    <div class="scramble-pool" dir="rtl">
      ${gd.pieces.shuffled.map(p=>`<button class="scramble-tile ${usedIds.includes(p.id)?'used':''}" ${usedIds.includes(p.id)?'disabled':''} onclick="pickMadinaScramble(${p.id})">${p.ch}</button>`).join('')}
    </div>
    <div class="unit-nav">
      <button onclick="undoMadinaScramble()">${icon('repeat',14)} Bekor qilish</button>
      <button class="primary" onclick="checkMadinaScramble()">Tekshirish</button>
    </div>
    <div class="ex-feedback-slot" id="scrFeedback"></div>
  </div>`;
  m.innerHTML = html;
}
function pickMadinaScramble(id){
  const gd = STATE.madinaGameData;
  const piece = gd.pieces.shuffled.find(p=>p.id===id);
  if(!piece || gd.picked.some(p=>p.id===id)) return;
  gd.picked.push(piece);
  render();
}
function undoMadinaScramble(){
  const gd = STATE.madinaGameData;
  gd.picked.pop();
  render();
}
function checkMadinaScramble(){
  const gd = STATE.madinaGameData;
  const item = gd.items[gd.idx];
  const attempt = gd.picked.map(p=>p.ch).join('');
  const target = item.ar.replace(/\s+/g,'');
  const correct = attempt === target;
  if(correct) gd.score++;
  const fb = document.getElementById('scrFeedback');
  fb.innerHTML = `<div class="ex-feedback ${correct?'ok':'no'}">${correct?"&#10003; To'g'ri!":"&#10007; To'g'ri javob: "}<span class="ar">${correct?'':item.ar}</span></div>`;
  setTimeout(()=>{ gd.idx++; gd.picked=[]; gd.pieces=null; render(); }, 1300);
}

/* ---- Game 5: Speed round (timed MCQ) ---- */
const SPEED_SECONDS = 45;
function speedBarMarkup(gd){
  const pct = Math.max(0, Math.round((gd.timeLeft / (gd.total || SPEED_SECONDS)) * 100));
  const low = gd.timeLeft <= 10 ? ' is-low' : '';
  return `<div class="speed-bar${low}" id="speedBar">
    <div class="speed-bar-head">
      <span>${icon('clock',16)} ${gd.timeLeft}s</span>
      <span>${icon('target',16)} ${gd.score}</span>
    </div>
    <div class="speed-track"><div class="speed-fill" style="width:${pct}%"></div></div>
  </div>`;
}
function madinaBuildSpeed(pool){
  return {pool, score:0, wrong:0, timeLeft:SPEED_SECONDS, total:SPEED_SECONDS, current:null, timerId:null};
}
function madinaNextSpeedQ(){
  const gd = STATE.madinaGameData;
  const pool = gd.pool;
  const it = pool[Math.floor(Math.random()*pool.length)];
  let distractors = pool.filter(x=>x.uz!==it.uz).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.uz);
  const options = [it.uz, ...distractors].sort(()=>Math.random()-0.5);
  gd.current = {ar:it.ar, tr:it.tr, answer:it.uz, options, correctIndex:options.indexOf(it.uz)};
}
function renderMadinaSpeed(m, pool){
  const isNew = !STATE.madinaGameData;
  if(isNew) STATE.madinaGameData = madinaBuildSpeed(pool);
  const gd = STATE.madinaGameData;
  if(gd.timeLeft <= 0){
    if(gd.timerId){ clearInterval(gd.timerId); gd.timerId=null; }
    m.innerHTML = `<div class="folio" style="text-align:center;">
      ${madinaGameHeader('Tezkor tur')}
      <div class="milestone"><div class="star">${icon('clock',36)}</div><h3>Vaqt tugadi!</h3>
      <p>${gd.score} to'g'ri, ${gd.wrong} xato.</p></div>
      <div class="unit-nav"><button onclick="startMadinaGame('speed')">${icon('repeat',14)} Qayta boshlash</button>
      <button class="primary" onclick="go('madina')">Tayyor</button></div></div>`;
    return;
  }
  if(!gd.current) madinaNextSpeedQ();
  let html = `<div class="folio">
    ${madinaGameHeader('Tezkor tur')}
    ${speedBarMarkup(gd)}
    <div class="alifbo-flashcard"><div class="alifbo-big-ar" style="font-size:2.6rem;">${gd.current.ar}</div><div class="alifbo-answer">${gd.current.tr}</div></div>
    <div class="ex-options" id="spOpts">
      ${gd.current.options.map((opt,i)=>`<button class="ex-opt" onclick="answerMadinaSpeed(${i})">${opt}</button>`).join('')}
    </div>
  </div>`;
  m.innerHTML = html;
  if(isNew || !gd.timerId){
    gd.timerId = setInterval(()=>{
      gd.timeLeft--;
      if(STATE.view!=='madinaGame' || STATE.madinaGameType!=='speed'){ clearInterval(gd.timerId); gd.timerId=null; return; }
      if(gd.timeLeft<=0){ clearInterval(gd.timerId); gd.timerId=null; render(); return; }
      const bar = document.querySelector('.speed-bar');
      if(bar) bar.outerHTML = speedBarMarkup(gd);
    }, 1000);
  }
}
function answerMadinaSpeed(i){
  const gd = STATE.madinaGameData;
  const opts = document.querySelectorAll('#spOpts .ex-opt');
  if(opts[0] && opts[0].classList.contains('disabled')) return;
  const correct = i === gd.current.correctIndex;
  if(correct) gd.score++; else gd.wrong++;
  opts.forEach((o,idx)=>{ o.classList.add('disabled'); if(idx===gd.current.correctIndex) o.classList.add('correct'); else if(idx===i) o.classList.add('wrong'); });
  setTimeout(()=>{ gd.current=null; render(); }, 450);
}

      <p style="margin-top:12px;">Arab harflarini tanish, ularni ulash, va bitta Qur'on oyatini o'zingiz o'qishgacha — ${starLevels.length} ta qisqa, o'yinsimon bosqich (har biri 2-3 daqiqa). Shundan keyin — eng ko'p uchraydigan xatolarni tuzatuvchi ${ALIFBO_LEVELS.length-starLevels.length} ta chuqur tajvid qoidasi, misollar va mashqlar bilan.</p>
    </div>
    <div class="chip-row" style="margin:0 0 20px;">
      <span class="chip">&#9733; ${totalStars} / ${maxStars} yulduz</span>
    </div>
    <div class="alifbo-path">
      ${ALIFBO_LEVELS.map(lvl=>{
        if(lvl.kind === 'rule'){
          const done = isDone(lvl.id);
          return `<button class="alifbo-node ${done?'done':''}" onclick="go('alifboLevel',{alifboLevelId:'${lvl.id}'})">
            <span class="alifbo-node-ic">${lvl.icon}</span>
            <span class="alifbo-node-body">
              <span class="alifbo-node-title">${lvl.title}</span>
              <span class="alifbo-node-sub">${lvl.sub}</span>
            </span>
            <span class="alifbo-node-stars">${done ? '&#10003;' : '&#9675;'}</span>
          </button>`;
        }
        const st = prog.stars[lvl.id]||0;
        const stars = `<span class="on">${'&#9733;'.repeat(st)}</span>${'&#9734;'.repeat(3-st)}`;
        return `<button class="alifbo-node ${st>0?'done':''}" onclick="go('alifboLevel',{alifboLevelId:'${lvl.id}'})">
          <span class="alifbo-node-ic">${lvl.icon}</span>
          <span class="alifbo-node-body">
            <span class="alifbo-node-title">${lvl.title}</span>
            <span class="alifbo-node-sub">${lvl.sub}</span>
          </span>
          <span class="alifbo-node-stars">${stars}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
  m.innerHTML = html;
}

function renderAlifboLevel(m){
  const lvl = ALIFBO_LEVELS.find(l=>l.id===STATE.alifboLevelId);
  if(!lvl){ go('alifbo'); return; }
  if(lvl.kind === 'rule') return renderAlifboRuleLevel(m, lvl);
  if(STATE.alifboPhase === 'reading') return renderAlifboReading(m, lvl);
  if(STATE.alifboPhase === 'quiz') return renderAlifboQuizScreen(m, lvl);
  if(STATE.alifboPhase === 'done') return renderAlifboDone(m, lvl);
  return renderAlifboCards(m, lvl);
}

/* Syllable-blending reading drills shown after the flashcards, before the
   quiz, for kind:'letters' groups that have a `reading` list. Cumulative on
   every letter learned so far — always plain fatha, since kasra/damma/sukun
   aren't taught until later lessons. Transliteration is hidden by default
   so the learner reads the Arabic first; toggle reveals it to self-check. */
// Each word is its own tiny flashcard: tap it to flip and reveal just
// that word's transliteration, instead of one button toggling all of them
// at once — so a learner can self-check word by word.
function readingGrid(items){
  return `<div class="reading-grid">
    ${items.map(w=>`<div class="reading-cell" onclick="this.classList.toggle('flipped')"><span class="ar">${w.ar}</span><span class="tr">${w.tr}</span></div>`).join('')}
  </div>`;
}

function renderAlifboReading(m, lvl){
  let html = `<div class="folio">
    <div class="section-label"><span class="dot">${icon('book-open',14)}</span>O'qish mashqi</div>
    <p class="prose" style="font-size:.88rem;opacity:.8;">${lvl.readingNote || ''} So'zga bosing — transliteratsiyasi ochiladi.</p>
    ${readingGrid(lvl.reading)}
    <div class="unit-nav" style="margin-top:18px;">
      <button onclick="STATE.alifboPhase='cards'; render();">&#8592; Kartochkalarga qaytish</button>
      <button class="primary" onclick="startAlifboQuiz()">Testga o'tish ${icon('zap',14)}</button>
    </div>
  </div>`;
  m.innerHTML = html;
}

/* Deep-dive tajweed rule lessons (kind:'rule') — same intro/blocks/table/
   exercises schema as UNITS, rendered as a single scrollable lesson rather
   than the letter-drill flashcard+quiz flow used by the other alifbo kinds. */
function renderAlifboRuleLevel(m, lvl){
  const idx = ALIFBO_LEVELS.findIndex(l=>l.id===lvl.id);
  let html = `<div class="folio">
    <div class="unit-hero">
      <span class="badge">Tajvid qoidasi</span>
      <h1>${lvl.title}</h1>
      <span class="ar ar-mixed">${bidiIsolate(lvl.sub||'')}</span>
    </div>
    <div class="section-label"><span class="dot">A</span>Kirish</div>
    <div class="prose"><p>${lvl.intro}</p></div>`;

  if(lvl.blocks){
    lvl.blocks.forEach(b=>{
      html += `<div class="card qoida"><div class="card-title"><span class="ic">Q</span>${b.h}</div>${b.p.map(p=>`<p>${p}</p>`).join('')}</div>`;
    });
  }

  if(lvl.table){
    const hasAr = s => /[؀-ۿ]/.test(String(s));
    html += `<div class="section-label"><span class="dot">&#9636;</span>${lvl.table.title}</div>
    <div class="table-wrap"><table class="ref-table"><tr>${lvl.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr>
    ${lvl.table.rows.map(r=>`<tr>${r.map((c)=>`<td class="${hasAr(c)?'ar':''}">${c}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
  }

  if(lvl.tafakkur){
    html += `<div class="card tafakkur"><div class="card-title"><span class="ic">T</span>Tafakkur</div><p>${lvl.tafakkur}</p></div>`;
  }
  if(lvl.talaffuz){
    html += `<div class="card talaffuz"><div class="card-title"><span class="ic">${icon('music',16)}</span>Talaffuz</div><p>${lvl.talaffuz}</p></div>`;
  }

  if(lvl.reading && lvl.reading.length){
    html += `<div class="section-label"><span class="dot">${icon('book-open',14)}</span>O'qish mashqi</div>
    <p class="prose" style="font-size:.88rem;opacity:.8;">${lvl.readingNote || ''} So'zga bosing — transliteratsiyasi ochiladi.</p>
    ${readingGrid(lvl.reading)}`;
  }

  html += `<div class="section-label"><span class="dot">${icon('pencil',14)}</span>Mashqlar</div><div id="exwrap"></div>`;

  html += `<div class="prose" style="margin-top:16px;"><p><b>${lvl.closing || ''}</b></p></div>`;

  html += `<label style="display:flex;align-items:center;gap:10px;margin-top:20px;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;cursor:pointer;">
      <input type="checkbox" id="donecheck"  ${isDone(lvl.id)?'checked':''} onchange="markDone('${lvl.id}', this.checked); go('alifboLevel',{alifboLevelId:'${lvl.id}'});">
      <span style="font-family:var(--font-ui);font-weight:700;font-size:.88rem;">Bu darsni tugatdim</span>
    </label>`;

  const prev = ALIFBO_LEVELS[idx-1];
  const next = ALIFBO_LEVELS[idx+1];
  html += `<div class="unit-nav">
    <button ${prev?'':'disabled'} onclick="${prev?`go('alifboLevel',{alifboLevelId:'${prev.id}'})`:''}">&#8592; Oldingi</button>
    <button class="primary" ${next?'':'disabled'} onclick="${next?`go('alifboLevel',{alifboLevelId:'${next.id}'})`:''}">Keyingi &#8594;</button>
  </div>`;

  html += `</div>`;
  m.innerHTML = html;

  const exwrap = document.getElementById('exwrap');
  lvl.exercises.forEach((ex,i)=> exwrap.appendChild(buildExercise(ex, lvl.id, i)));
}

function renderAlifboCards(m, lvl){
  const idx = STATE.alifboCardIdx || 0;
  const item = lvl.items[idx];
  const forms = alifboForms(item);
  let html = `<div class="folio">
    <div class="alifbo-progress-dots">${lvl.items.map((_,i)=>`<span class="dot ${i===idx?'active':i<idx?'past':''}"></span>`).join('')}</div>
    <div class="alifbo-flashcard">
      <div class="alifbo-big-ar">${item.ar}</div>
      <div class="alifbo-answer">${item.answer}</div>
      <p class="prose" style="text-align:center;">${item.detail}</p>
      ${forms ? `<div class="alifbo-forms-table">
        ${forms.map(([label,ar])=>`<div class="alifbo-form-cell"><span class="ar">${ar}</span><span class="label">${label}</span></div>`).join('')}
      </div>` : ''}
    </div>
    <div class="unit-nav">
      <button ${idx<=0?'disabled':''} onclick="STATE.alifboCardIdx=${idx-1}; render();">&#8592; Oldingi</button>
      ${idx < lvl.items.length-1
        ? `<button class="primary" onclick="STATE.alifboCardIdx=${idx+1}; render();">Keyingi &#8594;</button>`
        : lvl.reading && lvl.reading.length
          ? `<button class="primary" onclick="STATE.alifboPhase='reading'; render();">O'qish mashqi ${icon('book-open',14)}</button>`
          : `<button class="primary" onclick="startAlifboQuiz()">Testga o'tish ${icon('zap',14)}</button>`}
    </div>
  </div>`;
  m.innerHTML = html;
}

function generateAlifboQuiz(lvl){
  const pool = ALIFBO_LEVELS.flatMap(l=>l.items.map(it=>it.answer));
  const qs = lvl.items.map(it=>{
    let distractors = lvl.items.map(x=>x.answer).filter(a=>a!==it.answer);
    let guard = 0;
    while(distractors.length<3 && guard<50){
      const cand = pool[Math.floor(Math.random()*pool.length)];
      if(cand!==it.answer && !distractors.includes(cand)) distractors.push(cand);
      guard++;
    }
    distractors = distractors.sort(()=>Math.random()-0.5).slice(0,3);
    const options = [it.answer, ...distractors].sort(()=>Math.random()-0.5);
    return {ar:it.ar, answer:it.answer, options, correctIndex:options.indexOf(it.answer)};
  });
  return qs.sort(()=>Math.random()-0.5);
}

function startAlifboQuiz(){
  const lvl = ALIFBO_LEVELS.find(l=>l.id===STATE.alifboLevelId);
  STATE.alifboQuiz = generateAlifboQuiz(lvl);
  STATE.alifboQuizIdx = 0;
  STATE.alifboQuizScore = 0;
  STATE.alifboPhase = 'quiz';
  render();
}

function renderAlifboQuizScreen(m, lvl){
  const q = STATE.alifboQuiz[STATE.alifboQuizIdx];
  const promptLabel = lvl.kind === 'letters' ? "Bu harf qanday nomlanadi?" : "Bu qanday o'qiladi?";
  let html = `<div class="folio">
    <div class="alifbo-progress-dots">${STATE.alifboQuiz.map((_,i)=>`<span class="dot ${i===STATE.alifboQuizIdx?'active':i<STATE.alifboQuizIdx?'past':''}"></span>`).join('')}</div>
    <div class="alifbo-flashcard">
      <div class="alifbo-big-ar">${q.ar}</div>
      <p style="text-align:center;font-weight:700;font-family:var(--font-ui);">${promptLabel}</p>
    </div>
    <div class="ex-options" id="alifboOpts">
      ${q.options.map((opt,i)=>`<button class="ex-opt" onclick="answerAlifboQuiz(${i})">${opt}</button>`).join('')}
    </div>
    <div class="ex-feedback-slot" id="alifboFeedback"></div>
  </div>`;
  m.innerHTML = html;
}

function answerAlifboQuiz(i){
  const q = STATE.alifboQuiz[STATE.alifboQuizIdx];
  const opts = document.querySelectorAll('#alifboOpts .ex-opt');
  if(opts[0] && opts[0].classList.contains('disabled')) return;
  const correct = i === q.correctIndex;
  if(correct) STATE.alifboQuizScore++;
  opts.forEach((o,idx)=>{
    o.classList.add('disabled');
    if(idx===q.correctIndex) o.classList.add('correct');
    else if(idx===i) o.classList.add('wrong');
  });
  const fb = document.getElementById('alifboFeedback');
  fb.innerHTML = `<div class="ex-feedback ${correct?'ok':'no'}">${correct?"&#10003; To'g'ri!":"&#10007; To'g'ri javob: "+q.answer}</div>`;
  setTimeout(()=>{
    if(STATE.alifboQuizIdx < STATE.alifboQuiz.length-1){
      STATE.alifboQuizIdx++;
      render();
    } else {
      finishAlifboLevel();
    }
  }, 1100);
}

function finishAlifboLevel(){
  const lvl = ALIFBO_LEVELS.find(l=>l.id===STATE.alifboLevelId);
  const pct = STATE.alifboQuizScore / STATE.alifboQuiz.length;
  const stars = pct>=0.95 ? 3 : pct>=0.7 ? 2 : pct>=0.4 ? 1 : 0;
  const prog = loadAlifboProgress();
  prog.stars[lvl.id] = Math.max(prog.stars[lvl.id]||0, stars);
  saveAlifboProgress(prog);
  STATE.alifboPhase = 'done';
  STATE.alifboStarsEarned = stars;
  recordActivity();
  render();
}

function retryAlifboLevel(){
  STATE.alifboPhase = 'cards';
  STATE.alifboCardIdx = 0;
  render();
}

function renderAlifboDone(m, lvl){
  const stars = STATE.alifboStarsEarned || 0;
  const idx = ALIFBO_LEVELS.findIndex(l=>l.id===lvl.id);
  const next = ALIFBO_LEVELS[idx+1];
  const heading = stars>=2 ? "Ajoyib!" : "Yaxshi urinish!";
  let html = `<div class="folio" style="text-align:center;">
    <div class="milestone">
      <div class="star">${'&#9733;'.repeat(stars)}${'&#9734;'.repeat(3-stars)}</div>
      <h3>${heading}</h3>
      <p style="text-align:center;">${STATE.alifboQuizScore} / ${STATE.alifboQuiz.length} to'g'ri javob.</p>
    </div>
    <div class="unit-nav">
      <button onclick="retryAlifboLevel()">&#8635; Qayta urinish</button>
      ${next ? `<button class="primary" onclick="go('alifboLevel',{alifboLevelId:'${next.id}'})">Keyingi bosqich &#8594;</button>`
             : `<button class="primary" onclick="go('alifbo')">Xaritaga qaytish</button>`}
    </div>
  </div>`;
  m.innerHTML = html;
}

/* ================= ACHIEVEMENT CERTIFICATE ================= */
const UZ_MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
function formatUzDate(d){ return `${d.getDate()}-${UZ_MONTHS[d.getMonth()]}, ${d.getFullYear()}`; }

function wrapLines(ctx, text, maxWidth){
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines;
}
function drawCenteredLines(ctx, lines, cx, startY, lineHeight){
  lines.forEach((l,i)=> ctx.fillText(l, cx, startY + i*lineHeight));
  return startY + (lines.length-1)*lineHeight;
}

function eightPointStarPath(ctx, cx, cy, rOuter, rInner){
  ctx.beginPath();
  for(let i=0;i<16;i++){
    const ang = Math.PI/8*i - Math.PI/2;
    const r = i%2===0 ? rOuter : rInner;
    const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function buildCertificateCanvas(title, subtitle, arabicLine, recipientName){
  const W = 1200, H = 800;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const SANS = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif";

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#160409'); grad.addColorStop(0.55,'#4a0f24'); grad.addColorStop(1,'#1c060e');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = '#e8577a'; ctx.lineWidth = 6;
  ctx.strokeRect(38,38,W-76,H-76);
  ctx.strokeStyle = 'rgba(232,87,122,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(56,56,W-112,H-112);

  ctx.fillStyle = 'rgba(232,87,122,0.85)';
  [[56,56],[W-56,56],[56,H-56],[W-56,H-56]].forEach(([x,y])=>{ eightPointStarPath(ctx, x, y, 15, 6); ctx.fill(); });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 24px ${SANS}`;
  ctx.fillText('A R A B I X', W/2, 122);

  let y = 122;
  if(arabicLine){
    y += 52;
    ctx.fillStyle = 'rgba(232,87,122,0.9)';
    ctx.font = '400 32px "Naskh Quran", "Noto Naskh Arabic", serif';
    ctx.fillText(arabicLine, W/2, y);
  }

  if(recipientName){
    y += 50;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `400 17px ${SANS}`;
    ctx.fillText("USHBU SERTIFIKAT TAQDIM ETILADI", W/2, y);
    y += 50;
    ctx.fillStyle = '#ffffff';
    ctx.font = `700 44px ${SANS}`;
    ctx.fillText(recipientName, W/2, y);
  }

  y += 75;
  ctx.fillStyle = '#e8577a';
  ctx.font = `700 50px ${SANS}`;
  ctx.fillText('Tabriklaymiz!', W/2, y);

  y += 65;
  ctx.fillStyle = '#ffffff';
  ctx.font = `400 27px ${SANS}`;
  const titleLines = wrapLines(ctx, title, 880);
  y = drawCenteredLines(ctx, titleLines, W/2, y, 38) + 55;

  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = `400 21px ${SANS}`;
  const subLines = wrapLines(ctx, subtitle, 780);
  drawCenteredLines(ctx, subLines, W/2, y, 30);

  const dateStr = formatUzDate(new Date());
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = `400 19px ${SANS}`;
  ctx.fillText(dateStr, W/2, H-64);

  return canvas;
}

function downloadMilestoneCertificate(unitId, recipientName){
  const isBook1 = unitId === 20;
  const title = isBook1
    ? "1-kitob — Poydevor va Naqshlar — muvaffaqiyatli yakunlandi"
    : "2-kitob va butun kurs — 0dan Qahramongacha — muvaffaqiyatli yakunlandi";
  const subtitle = isBook1
    ? "20 dars, o'nlab sura va oyat, minglab so'z — barchasi o'zlashtirildi"
    : "41 dars, 20dan ortiq sura, Al-Baqara va Al-Kahf chuqur o'rganildi";
  const canvas = buildCertificateCanvas(title, subtitle, 'بارك الله فيك', recipientName || '');
  const link = document.createElement('a');
  link.download = isBook1 ? 'arabix-1-kitob-sertifikat.png' : 'arabix-2-kitob-sertifikat.png';
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast("Sertifikat saqlandi!");
}

/* ================= ONE-TIME WELCOME CERTIFICATE =================
   Shows a specific certificate full-screen the first time the app
   is opened on a device, then never again (localStorage flag).
   This is a one-off announcement, not a general feature — remove
   this block (or the localStorage key check will just no-op after
   everyone's seen it once) once it's served its purpose. */
function maybeShowWelcomeCertificate(){
  const KEY = 'qa_welcome_cert_shown_v1';
  if(localStorage.getItem(KEY)) return;
  const canvas = buildCertificateCanvas(
    "Arabix — Qur'oniy Arabcha o'rganish sayohati",
    "Nol darajadan Qur'onni o'zi o'qib tushunishgacha — bu yo'lga xush kelibsiz",
    'بارك الله فيك',
    'Gullola Karimova'
  );
  const dataUrl = canvas.toDataURL('image/png');
  const ov = document.createElement('div');
  ov.className = 'welcome-cert-overlay';
  ov.innerHTML = `
    <div class="welcome-cert-card">
      <img src="${dataUrl}" alt="Sertifikat" class="welcome-cert-img">
      <button class="action-btn primary" style="margin-top:16px;width:100%;" id="welcomeCertClose">Davom etish &rarr;</button>
    </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=> ov.classList.add('open'));
  document.getElementById('welcomeCertClose').onclick = ()=>{
    ov.classList.remove('open');
    setTimeout(()=> ov.remove(), 300);
    localStorage.setItem(KEY, '1');
  };
}

/* ================= NATIVE HARDWARE BACK BUTTON (Android app) =================
   In a normal browser this is a no-op (window.Capacitor doesn't exist there).
   Inside the Capacitor Android wrapper, without this listener the hardware/
   gesture back button falls through to the WebView's default handling — which
   has no browser history to step through (this is a pure JS-state SPA, no
   pushState), so it was reloading the page back to the home screen instead of
   going back one screen like the in-app back button does. */
function setupHardwareBackButton(){
  const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!CapApp) return;
  CapApp.addListener('backButton', ()=>{
    const moved = goBack();
    if(!moved) CapApp.exitApp();
  });
}

  if(STATE.view==='mushaf') fitMushafLines(document.querySelector('.mushaf-page'));
});

initTheme();
